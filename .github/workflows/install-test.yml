name: Installer unavailable contract

# The public installer URLs remain stable while releases are disabled. Validate
# that both scripts parse and fail closed with a useful rewrite message; never
# contact or download historical GitHub release assets.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/install.sh"
      - "scripts/install.ps1"
      - ".github/workflows/install-test.yml"
  pull_request:
    paths:
      - "scripts/install.sh"
      - "scripts/install.ps1"
      - ".github/workflows/install-test.yml"

permissions:
  contents: read

concurrency:
  group: install-test-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unavailable-contract:
    name: syntax and fail-closed behavior
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Parse installers
        shell: pwsh
        run: |
          bash -n scripts/install.sh
          shellcheck -S warning scripts/install.sh

          $errors = $null
          [System.Management.Automation.PSParser]::Tokenize(
            (Get-Content scripts/install.ps1 -Raw),
            [ref]$errors
          ) | Out-Null
          if ($errors -and $errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Bash installer fails closed
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(bash scripts/install.sh --version latest 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [[ "$status" -eq 0 ]]; then
            echo "installer unexpectedly reported success" >&2
            exit 1
          fi
          grep -Fq "installation is unavailable during the clean-slate rewrite" <<<"$output"

      - name: PowerShell installer fails closed
        shell: pwsh
        run: |
          $output = & pwsh -NoProfile -File scripts/install.ps1 -Version latest 2>&1
          $status = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($status -eq 0) {
            Write-Error "installer unexpectedly reported success"
            exit 1
          }
          if (($output | Out-String) -notmatch "installation is unavailable during the clean-slate rewrite") {
            Write-Error "installer did not report the rewrite-unavailable message"
            exit 1
          }
          exit 0
