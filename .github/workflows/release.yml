name: Release unavailable during rewrite

# The clean-slate compiler is an R0 validation artifact, not a product release.
# Keep tag/manual invocations visible and explicitly blocked so a tag cannot
# accidentally publish incomplete binaries.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag requested for release (publishing is currently blocked)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  unavailable:
    name: Native release is intentionally unavailable
    runs-on: ubuntu-latest
    steps:
      - name: Explain the rewrite release gate
        shell: bash
        run: |
          echo "::error title=TSZ release unavailable::The clean-slate compiler is still an R0 validation artifact. Native release publication stays disabled until its supported surface is explicitly approved for distribution. WASM returns at R4."
          exit 1
