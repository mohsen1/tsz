name: Validate README rewrite status

# The retired compiler's metrics remain checked-in evidence. They must not be
# copied into the clean-slate README as live compatibility or performance data.
# This workflow is intentionally read-only and never opens refresh PRs.

on:
  pull_request:
    paths:
      - README.md
      - scripts/refresh-readme.py
      - scripts/ci/test_refresh_readme.py
      - .github/workflows/readme-benchmark-refresh.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readme-rewrite-status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate README rewrite status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Reject stale live-dashboard claims
        run: python3 scripts/refresh-readme.py --check

      - name: Test README status contract
        run: python3 -m unittest scripts.ci.test_refresh_readme
