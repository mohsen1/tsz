name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:
  push:
    branches:
      - main
  schedule:
    # Nightly full-corpus observation. These retained runners describe how
    # much of the legacy perimeter the rewrite can currently execute; they do
    # not impose the retired implementation's compatibility floor on R0.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      refresh_tsc_cache:
        description: 'Run only the full TypeScript 7 conformance cache refresh lane'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  # Event is part of the group so a long nightly cannot queue behind (or
  # block) push-to-main runs: both resolve github.ref to refs/heads/main.
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  clippy:
    # Keep the historical required-check name while broadening its contract to
    # the complete R0 foundation gate.
    name: clippy
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.refresh_tsc_cache != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Install Rust components
        run: rustup component add clippy rustfmt
      - name: Install cargo-nextest
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2
        with:
          tool: cargo-nextest
      - name: Check shell portability (macOS /bin/bash 3.2)
        run: |
          python3 scripts/lib/check-sh-portability.py
          python3 scripts/lib/test_check_sh_portability.py
      - name: Check TypeScript corpus and tool-resolution safety
        run: |
          python3 scripts/ci/test_typescript_corpus_init.py
          python3 scripts/setup/test_reset_typescript_corpus.py
          node scripts/bench/test-typescript-tool-resolution.mjs
      - name: Check rewrite unit-lane contracts
        run: scripts/ci/check-unit-gate-contracts.sh
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check active workspace
        run: |
          scripts/safe-run.sh --limit 88% -- \
            cargo check --workspace --all-targets
      - name: Run cargo clippy
        run: |
          scripts/safe-run.sh --limit 88% -- \
            cargo clippy --profile ci-lint --workspace \
              --all-targets -- -D warnings
      - name: Run rewrite unit tests
        run: |
          scripts/safe-run.sh --limit 88% -- \
            cargo nextest run --workspace

  unit:
    name: rewrite-unit-nightly
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && inputs.refresh_tsc_cache != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Run unit tests
        run: scripts/ci/github-suite.sh unit

  conformance:
    name: conformance-observation-${{ matrix.shard }}
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && inputs.refresh_tsc_cache != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      _TSZ_CI_CONFORMANCE_SHARD_INDEX: ${{ matrix.shard }}
      _TSZ_CI_CONFORMANCE_SHARD_COUNT: 4
      TSZ_CI_CONFORMANCE_SHARDS: 4
      TSZ_CI_CONFORMANCE_SHARD_STRATEGY: weighted
      TSZ_CI_CACHE_SAVE: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Observe conformance shard
        id: observe
        continue-on-error: true
        run: scripts/ci/github-suite.sh conformance
      - name: Report conformance observation status
        if: always()
        run: |
          echo "::notice::Conformance is an R0 full-corpus observation; runner outcome=${{ steps.observe.outcome }}. Compatibility failures are preserved in the artifact and do not gate the rewrite foundation."
      - name: Upload conformance shard result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-shard-${{ matrix.shard }}
          path: |
            ci-metrics/conformance.json
            ci-metrics/conformance-failures-*.txt
            ci-metrics/conformance-timings-*.json
            .ci-logs/full-ci.log
            .ci-status/check-summary.md
            .ci-status/full-ci.exit
          if-no-files-found: warn
          retention-days: 14

  conformance-aggregate:
    name: conformance-observation-aggregate
    needs: conformance
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.refresh_tsc_cache != true) && needs.conformance.result != 'skipped' && needs.conformance.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      _TSZ_CI_CONFORMANCE_SHARD_COUNT: 4
      TSZ_CI_CONFORMANCE_SHARDS: 4
      TSZ_CI_CACHE_SAVE: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Download conformance shard results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: conformance-shard-*
          path: .conformance-shards
          merge-multiple: false
      - name: Aggregate conformance observation
        id: observe
        continue-on-error: true
        run: scripts/ci/github-suite.sh conformance-aggregate
      - name: Upload conformance observation aggregate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-observation-aggregate
          path: |
            ci-metrics/conformance.json
            .ci-logs/full-ci.log
            .ci-status/check-summary.md
            .ci-status/full-ci.exit
          if-no-files-found: warn
          retention-days: 14

  emit:
    name: emit-observation-${{ matrix.shard }}
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && inputs.refresh_tsc_cache != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      _TSZ_CI_EMIT_SHARD_INDEX: ${{ matrix.shard }}
      _TSZ_CI_EMIT_SHARD_COUNT: 4
      TSZ_CI_CACHE_SAVE: "0"
      TSZ_CI_CACHE_RESTORE: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Observe emit shard
        id: observe
        continue-on-error: true
        run: scripts/ci/github-suite.sh emit-shard
      - name: Report emit observation status
        if: always()
        run: |
          echo "::notice::Emit is an R0 full-corpus observation; runner outcome=${{ steps.observe.outcome }}. Compatibility failures are preserved in the artifact and do not gate the rewrite foundation."
      - name: Upload emit shard result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emit-shard-${{ matrix.shard }}
          path: |
            ci-metrics/emit-shard-${{ matrix.shard }}.json
            ci-metrics/emit-detail-${{ matrix.shard }}.json
            .ci-logs/emit/*.log
            .ci-logs/full-ci.log
            .ci-status/check-summary.md
            .ci-status/full-ci.exit
          if-no-files-found: warn
          retention-days: 14

  emit-aggregate:
    name: emit-observation-aggregate
    needs: emit
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.refresh_tsc_cache != true) && needs.emit.result != 'skipped' && needs.emit.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      _TSZ_CI_EMIT_SHARD_COUNT: 4
      TSZ_CI_CACHE_SAVE: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Download emit shard results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: emit-shard-*
          path: .emit-shards
          merge-multiple: false
      - name: Aggregate emit observation
        id: observe
        continue-on-error: true
        run: scripts/ci/github-suite.sh emit-aggregate
      - name: Enforce rewrite emit direction
        if: always()
        run: |
          set -Eeuo pipefail
          details=()
          for index in 0 1 2 3; do
            mapfile -t matches < <(
              find .emit-shards -type f -name "emit-detail-${index}.json" -print
            )
            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "error: expected exactly one emit detail shard ${index}/4; found ${#matches[@]}" >&2
              exit 1
            fi
            details+=("${matches[0]}")
          done
          python3 scripts/ci/check-emit-regression-set.py \
            --baseline scripts/emit/rewrite-regression-baseline.json \
            --require-oracle-provenance \
            --reject-absent-baseline-rows \
            --oracle-manifest scripts/emit/oracle-manifest.json \
            "${details[@]}"
      - name: Upload emit observation aggregate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emit-observation-aggregate
          path: |
            ci-metrics/emit.json
            .ci-logs/full-ci.log
            .ci-status/check-summary.md
            .ci-status/full-ci.exit
          if-no-files-found: warn
          retention-days: 14

  fourslash:
    name: fourslash-observation-${{ matrix.shard }}
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && inputs.refresh_tsc_cache != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      _TSZ_CI_FOURSLASH_SHARD_INDEX: ${{ matrix.shard }}
      _TSZ_CI_FOURSLASH_SHARD_COUNT: 6
      TSZ_CI_FOURSLASH_SHARD_STRATEGY: weighted
      # Keep full-corpus observation bounded on hosted runners.
      TSZ_CI_FOURSLASH_WORKERS: 1
      TSZ_CI_FOURSLASH_TIMEOUT_MS: 60000
      TSZ_CI_CACHE_SAVE: "0"
      TSZ_CI_CACHE_RESTORE: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Observe fourslash shard
        id: observe
        continue-on-error: true
        run: scripts/ci/github-suite.sh fourslash-shard
      - name: Report fourslash observation status
        if: always()
        run: |
          echo "::notice::Fourslash is an R0 full-corpus observation; runner outcome=${{ steps.observe.outcome }}. Unsupported service behavior is preserved in the artifact and does not gate the rewrite foundation."
      - name: Upload fourslash shard result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fourslash-shard-${{ matrix.shard }}
          path: |
            ci-metrics/fourslash-shard-${{ matrix.shard }}.json
            .ci-logs/fourslash/*.log
            .ci-logs/full-ci.log
            .ci-status/check-summary.md
            .ci-status/full-ci.exit
          if-no-files-found: warn
          retention-days: 14

  fourslash-aggregate:
    name: fourslash-observation-aggregate
    needs: fourslash
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.refresh_tsc_cache != true) && needs.fourslash.result != 'skipped' && needs.fourslash.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      _TSZ_CI_FOURSLASH_SHARD_COUNT: 6
      TSZ_CI_CACHE_SAVE: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Download fourslash shard results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fourslash-shard-*
          path: .fourslash-shards
          merge-multiple: false
      - name: Aggregate fourslash observation
        id: observe
        continue-on-error: true
        run: scripts/ci/github-suite.sh fourslash-aggregate
      - name: Upload fourslash observation aggregate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fourslash-observation-aggregate
          path: |
            ci-metrics/fourslash.json
            .ci-logs/full-ci.log
            .ci-status/check-summary.md
            .ci-status/full-ci.exit
          if-no-files-found: warn
          retention-days: 14

  arch-size:
    name: arch-size
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.refresh_tsc_cache != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TSZ_ARCH_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || 'HEAD^' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run rewrite architecture guard
        run: |
          python3 scripts/arch/arch_guard.py
          python3 scripts/arch/rewrite_architecture_metrics.py \
            --check --base-ref "$TSZ_ARCH_BASE_SHA"
      - name: Prevent rewrite emit baseline ratchet-down
        run: |
          python3 scripts/ci/check-emit-regression-set.py \
            --check-baseline-history \
            --baseline scripts/emit/rewrite-regression-baseline.json \
            --oracle-manifest scripts/emit/oracle-manifest.json
      - name: Verify disabled inline-test archive
        run: python3 scripts/reset/verify-legacy-inline.py
      - name: Run architecture guard self-tests
        run: |
          cd scripts/arch
          python3 -m unittest discover -p "test_arch_guard*.py" -v

  refresh-tsc-cache:
    name: refresh-tsc-cache
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_tsc_cache == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Verify exact corpus and install pinned TypeScript 7
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          expected_corpus="$(node -e "const v=require('./scripts/conformance/typescript-versions.json'); process.stdout.write(v.current)")"
          expected_ref="$(tr -d '[:space:]' < scripts/ci/typescript-submodule-ref)"
          test "$expected_corpus" = "$expected_ref"

          git clone --filter=blob:none --no-checkout --depth 1 \
            https://github.com/microsoft/TypeScript.git TypeScript
          git -C TypeScript fetch --depth 1 origin "$expected_corpus"
          git -C TypeScript checkout --detach FETCH_HEAD
          actual_ref="$(git -C TypeScript rev-parse HEAD)"
          test "$expected_corpus" = "$actual_ref"
          test -d TypeScript/tests/cases
          test -d TypeScript/tests/lib

          npm install --prefix scripts --include=optional --ignore-scripts --no-audit --no-fund
          ./scripts/setup/ensure-pinned-typescript.sh scripts

          expected_tsc="$(node -e "const v=require('./scripts/conformance/typescript-versions.json'); process.stdout.write(v.mappings[v.current].npm)")"
          installed_tsc="$(node -p "require('./scripts/node_modules/typescript/package.json').version")"
          reported_tsc="$(node scripts/node_modules/typescript/lib/tsc.js --version)"
          test "$installed_tsc" = "$expected_tsc"
          test "$reported_tsc" = "Version $expected_tsc"

          platform_package="$(node -p "'@typescript/typescript-' + process.platform + '-' + process.arch")"
          platform_version="$(node -e "const fs=require('fs'); const p='scripts/node_modules/' + process.argv[1] + '/package.json'; process.stdout.write(JSON.parse(fs.readFileSync(p, 'utf8')).version)" "$platform_package")"
          test "$platform_version" = "$expected_tsc"

          lib_dir="$(scripts/conformance/corpus-lib-dir.sh)"
          echo "Corpus commit: $actual_ref"
          echo "TypeScript compiler: $reported_tsc"
          echo "TypeScript platform package: $platform_package@$platform_version"
          echo "TypeScript lib directory: $lib_dir"
          {
            echo "corpus_sha=$actual_ref"
            echo "typescript_version=$expected_tsc"
            echo "platform_package=$platform_package"
            echo "platform_version=$platform_version"
          } >> "$GITHUB_OUTPUT"

      - name: Build only generate-tsc-cache (memory guarded)
        shell: bash
        run: |
          scripts/safe-run.sh --limit 75% --interval 5 -- \
            cargo build --profile ci-unit --jobs 1 \
              -p tsz-conformance --bin generate-tsc-cache

      - name: Generate full TypeScript 7 cache (low concurrency)
        id: generate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cache-refresh "$RUNNER_TEMP/tsz-cache-refresh"
          export TMPDIR="$RUNNER_TEMP/tsz-cache-refresh"
          : > cache-refresh/generate-tsc-cache.log
          scripts/safe-run.sh --limit 75% --interval 5 -- \
            .target/ci-unit/generate-tsc-cache \
              --test-dir TypeScript/tests/cases \
              --output cache-refresh/tsc-cache-full.json \
              --domain-output cache-refresh/conformance-domain.json \
              --workers 2 \
              --max-node-procs 2 \
              --timeout 120 \
            2>&1 | tee cache-refresh/generate-tsc-cache.log

      - name: Write refresh metadata
        if: always()
        shell: bash
        env:
          GENERATE_OUTCOME: ${{ steps.generate.outcome }}
          PINNED_CORPUS_SHA: ${{ steps.pins.outputs.corpus_sha }}
          PINNED_TYPESCRIPT_VERSION: ${{ steps.pins.outputs.typescript_version }}
          TYPESCRIPT_PLATFORM_PACKAGE: ${{ steps.pins.outputs.platform_package }}
          TYPESCRIPT_PLATFORM_VERSION: ${{ steps.pins.outputs.platform_version }}
        run: |
          mkdir -p cache-refresh
          touch cache-refresh/generate-tsc-cache.log
          {
            echo "schema_version=1"
            echo "repository=$GITHUB_REPOSITORY"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "ref=$GITHUB_REF"
            echo "sha=$GITHUB_SHA"
            echo "generator_outcome=${GENERATE_OUTCOME:-not-run}"
            echo "corpus_sha=${PINNED_CORPUS_SHA:-unknown}"
            echo "typescript_version=${PINNED_TYPESCRIPT_VERSION:-unknown}"
            echo "typescript_platform_package=${TYPESCRIPT_PLATFORM_PACKAGE:-unknown}"
            echo "typescript_platform_version=${TYPESCRIPT_PLATFORM_VERSION:-unknown}"
            echo "workers=2"
            echo "max_node_procs=2"
            echo "timeout_seconds=120"
            echo "node_version=$(node --version 2>/dev/null || echo unavailable)"
            echo "rustc_version=$(rustc --version 2>/dev/null || echo unavailable)"
            if [[ -f cache-refresh/tsc-cache-full.json ]]; then
              echo "cache_bytes=$(stat -c %s cache-refresh/tsc-cache-full.json)"
              echo "cache_sha256=$(sha256sum cache-refresh/tsc-cache-full.json | awk '{print $1}')"
            fi
            if [[ -f cache-refresh/conformance-domain.json ]]; then
              echo "domain_bytes=$(stat -c %s cache-refresh/conformance-domain.json)"
              echo "domain_sha256=$(sha256sum cache-refresh/conformance-domain.json | awk '{print $1}')"
            fi
            sha256sum Cargo.lock scripts/conformance/typescript-versions.json \
              scripts/ci/typescript-submodule-ref 2>/dev/null || true
          } > cache-refresh/metadata.txt

      - name: Upload TypeScript 7 cache and domain
        if: ${{ steps.generate.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ts7-conformance-cache
          path: |
            cache-refresh/tsc-cache-full.json
            cache-refresh/conformance-domain.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload cache-refresh metadata and log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ts7-conformance-cache-metadata
          path: |
            cache-refresh/metadata.txt
            cache-refresh/generate-tsc-cache.log
          if-no-files-found: error
          retention-days: 30

  ci-summary:
    name: CI Summary
    needs:
      - clippy
      - unit
      - conformance
      - conformance-aggregate
      - emit
      - emit-aggregate
      - fourslash
      - fourslash-aggregate
      - arch-size
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.refresh_tsc_cache != true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify core CI jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          jobs = {
              "clippy",
              "unit",
              "conformance",
              "conformance-aggregate",
              "emit",
              "emit-aggregate",
              "fourslash",
              "fourslash-aggregate",
              "arch-size",
          }

          # The active rewrite gate is strict: formatting, cargo check, Clippy,
          # nextest, and the architecture guard must pass. Nightly/manual emit
          # additionally enforces the rewrite-era stable-key direction floor;
          # conformance and fourslash remain broad observations.
          fast = {"clippy", "arch-size"}
          heavy_lane_event = os.environ.get("EVENT_NAME") in {"schedule", "workflow_dispatch"}

          failures = []
          for name in sorted(jobs):
              result = needs.get(name, {}).get("result")
              if name in fast or (heavy_lane_event and name == "unit"):
                  passing = {"success"}
              elif heavy_lane_event:
                  # A behavior failure is continued inside the observation
                  # step. A failed job here therefore means the observation
                  # infrastructure itself did not complete.
                  passing = {"success"}
              else:
                  passing = {"success", "skipped"}
              if result not in passing:
                  failures.append(f"{name}: {result}")

          if failures:
              print("Required CI jobs did not pass:")
              for failure in failures:
                  print(f"  - {failure}")
              sys.exit(1)

          if heavy_lane_event:
              print(
                  "Rewrite foundation checks and rewrite unit tests passed. "
                  "The rewrite emit direction floor passed. Conformance and "
                  "fourslash artifacts, including unsupported cases, remain informational."
              )
          else:
              print(
                  "Rewrite foundation gate passed: fmt, check, Clippy, nextest, "
                  "and the architecture guard are green. Full-corpus conformance, "
                  "emit, and fourslash observations run nightly and manually."
              )
          PY
