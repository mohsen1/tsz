name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      refresh_tsc_cache:
        description: 'Run only the full TypeScript 7 conformance cache refresh lane'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  clippy:
    name: clippy
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.refresh_tsc_cache != true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
      - name: Install clippy
        run: rustup component add clippy
      - name: Check shell portability (macOS /bin/bash 3.2)
        run: |
          python3 scripts/lib/check-sh-portability.py
          python3 scripts/lib/test_check_sh_portability.py
      # Known-failures baseline contract (#15646): the unit job's green means
      # "no NEW unit failures", so the baseline may only move in reviewed ways
      # and the gate wiring itself is contract-tested here (cheap, <15s).
      - name: Known-failures baseline gate and unit-lane contract tests
        run: scripts/ci/check-unit-gate-contracts.sh
      - name: Run cargo clippy
        run: |
          scripts/safe-run.sh --limit 88% -- \
            cargo clippy --profile ci-lint --workspace --exclude tsz-conformance \
              --all-targets -- -D warnings

  unit:
    name: unit
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.refresh_tsc_cache != true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
      - name: Run unit tests
        run: scripts/ci/github-suite.sh unit

  conformance:
    name: conformance-${{ matrix.shard }}
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.refresh_tsc_cache != true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      _TSZ_CI_CONFORMANCE_SHARD_INDEX: ${{ matrix.shard }}
      _TSZ_CI_CONFORMANCE_SHARD_COUNT: 4
      TSZ_CI_CONFORMANCE_SHARDS: 4
      TSZ_CI_CONFORMANCE_SHARD_STRATEGY: weighted
      TSZ_CI_CACHE_SAVE: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
      - name: Run conformance shard
        run: scripts/ci/github-suite.sh conformance
      - name: Upload conformance shard result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-shard-${{ matrix.shard }}
          path: |
            ci-metrics/conformance.json
            ci-metrics/conformance-failures-*.txt
            ci-metrics/conformance-timings-*.json
          if-no-files-found: warn
          retention-days: 1

  conformance-aggregate:
    name: conformance-aggregate
    needs: conformance
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.refresh_tsc_cache != true) && needs.conformance.result != 'skipped' && needs.conformance.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      _TSZ_CI_CONFORMANCE_SHARD_COUNT: 4
      TSZ_CI_CONFORMANCE_SHARDS: 4
      TSZ_CI_CACHE_SAVE: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
      - name: Download conformance shard results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: conformance-shard-*
          path: .conformance-shards
          merge-multiple: false
      - name: Aggregate conformance results
        run: scripts/ci/github-suite.sh conformance-aggregate

  emit:
    name: emit-${{ matrix.shard }}
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.refresh_tsc_cache != true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      _TSZ_CI_EMIT_SHARD_INDEX: ${{ matrix.shard }}
      _TSZ_CI_EMIT_SHARD_COUNT: 4
      TSZ_CI_CACHE_SAVE: "0"
      TSZ_CI_CACHE_RESTORE: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
      - name: Run emit shard
        run: scripts/ci/github-suite.sh emit-shard
      - name: Upload emit shard result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emit-shard-${{ matrix.shard }}
          path: |
            ci-metrics/emit-shard-${{ matrix.shard }}.json
            ci-metrics/emit-detail-${{ matrix.shard }}.json
            .ci-logs/emit/*.log
          if-no-files-found: warn
          retention-days: 1

  emit-aggregate:
    name: emit-aggregate
    needs: emit
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.refresh_tsc_cache != true) && needs.emit.result != 'skipped' && needs.emit.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      _TSZ_CI_EMIT_SHARD_COUNT: 4
      TSZ_CI_CACHE_SAVE: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
      - name: Download emit shard results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: emit-shard-*
          path: .emit-shards
          merge-multiple: false
      - name: Aggregate emit results
        run: scripts/ci/github-suite.sh emit-aggregate

  fourslash:
    name: fourslash-${{ matrix.shard }}
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.refresh_tsc_cache != true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      _TSZ_CI_FOURSLASH_SHARD_INDEX: ${{ matrix.shard }}
      _TSZ_CI_FOURSLASH_SHARD_COUNT: 6
      TSZ_CI_FOURSLASH_SHARD_STRATEGY: weighted
      # Shard 4 repeatedly terminates hosted runners before artifact upload with
      # higher worker counts. Keep the PR gate reliable; weighted sharding still
      # leaves single-worker shards inside the job timeout.
      TSZ_CI_FOURSLASH_WORKERS: 1
      TSZ_CI_FOURSLASH_TIMEOUT_MS: 60000
      TSZ_CI_CACHE_SAVE: "0"
      TSZ_CI_CACHE_RESTORE: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
      - name: Run fourslash shard
        run: scripts/ci/github-suite.sh fourslash-shard
      - name: Upload fourslash shard result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fourslash-shard-${{ matrix.shard }}
          path: |
            ci-metrics/fourslash-shard-${{ matrix.shard }}.json
            .ci-logs/fourslash/*.log
          if-no-files-found: warn
          retention-days: 1

  fourslash-aggregate:
    name: fourslash-aggregate
    needs: fourslash
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.refresh_tsc_cache != true) && needs.fourslash.result != 'skipped' && needs.fourslash.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      _TSZ_CI_FOURSLASH_SHARD_COUNT: 6
      TSZ_CI_CACHE_SAVE: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
      - name: Download fourslash shard results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fourslash-shard-*
          path: .fourslash-shards
          merge-multiple: false
      - name: Aggregate fourslash results
        run: scripts/ci/github-suite.sh fourslash-aggregate

  arch-size:
    name: arch-size
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.refresh_tsc_cache != true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
      # Full guard (#15643): size caps, #8225 quarantine ratchets, metric-7
      # import counts, Track 10 residency counts, and boundary pattern checks
      # all gate merges. Ratchet baselines live in
      # scripts/arch/arch_guard_shared.py; pay down or intentionally bump them
      # in the same PR that moves a count.
      - name: Run full architecture guard
        run: python3 scripts/arch/arch_guard.py
      - name: Run architecture guard self-tests
        run: |
          cd scripts/arch
          python3 -m unittest discover -p "test_arch_guard*.py" -v 2>&1 | tail -20

  refresh-tsc-cache:
    name: refresh-tsc-cache
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_tsc_cache == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Verify exact corpus and install pinned TypeScript 7
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          expected_corpus="$(node -e "const v=require('./scripts/conformance/typescript-versions.json'); process.stdout.write(v.current)")"
          expected_ref="$(tr -d '[:space:]' < scripts/ci/typescript-submodule-ref)"
          test "$expected_corpus" = "$expected_ref"

          git clone --filter=blob:none --no-checkout --depth 1 \
            https://github.com/microsoft/TypeScript.git TypeScript
          git -C TypeScript fetch --depth 1 origin "$expected_corpus"
          git -C TypeScript checkout --detach FETCH_HEAD
          actual_ref="$(git -C TypeScript rev-parse HEAD)"
          test "$expected_corpus" = "$actual_ref"
          test -d TypeScript/tests/cases
          test -d TypeScript/tests/lib

          npm install --prefix scripts --include=optional --ignore-scripts --no-audit --no-fund
          ./scripts/setup/ensure-pinned-typescript.sh scripts

          expected_tsc="$(node -e "const v=require('./scripts/conformance/typescript-versions.json'); process.stdout.write(v.mappings[v.current].npm)")"
          installed_tsc="$(node -p "require('./scripts/node_modules/typescript/package.json').version")"
          reported_tsc="$(node scripts/node_modules/typescript/lib/tsc.js --version)"
          test "$installed_tsc" = "$expected_tsc"
          test "$reported_tsc" = "Version $expected_tsc"

          platform_package="$(node -p "'@typescript/typescript-' + process.platform + '-' + process.arch")"
          platform_version="$(node -e "const fs=require('fs'); const p='scripts/node_modules/' + process.argv[1] + '/package.json'; process.stdout.write(JSON.parse(fs.readFileSync(p, 'utf8')).version)" "$platform_package")"
          test "$platform_version" = "$expected_tsc"

          lib_dir="$(scripts/conformance/corpus-lib-dir.sh)"
          echo "Corpus commit: $actual_ref"
          echo "TypeScript compiler: $reported_tsc"
          echo "TypeScript platform package: $platform_package@$platform_version"
          echo "TypeScript lib directory: $lib_dir"
          {
            echo "corpus_sha=$actual_ref"
            echo "typescript_version=$expected_tsc"
            echo "platform_package=$platform_package"
            echo "platform_version=$platform_version"
          } >> "$GITHUB_OUTPUT"

      - name: Build only generate-tsc-cache (memory guarded)
        shell: bash
        run: |
          scripts/safe-run.sh --limit 75% --interval 5 -- \
            cargo build --profile ci-unit --jobs 1 \
              -p tsz-conformance --bin generate-tsc-cache

      - name: Generate full TypeScript 7 cache (low concurrency)
        id: generate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cache-refresh "$RUNNER_TEMP/tsz-cache-refresh"
          export TMPDIR="$RUNNER_TEMP/tsz-cache-refresh"
          : > cache-refresh/generate-tsc-cache.log
          scripts/safe-run.sh --limit 75% --interval 5 -- \
            .target/ci-unit/generate-tsc-cache \
              --test-dir TypeScript/tests/cases \
              --output cache-refresh/tsc-cache-full.json \
              --domain-output cache-refresh/conformance-domain.json \
              --workers 2 \
              --max-node-procs 2 \
              --timeout 120 \
            2>&1 | tee cache-refresh/generate-tsc-cache.log

      - name: Write refresh metadata
        if: always()
        shell: bash
        env:
          GENERATE_OUTCOME: ${{ steps.generate.outcome }}
          PINNED_CORPUS_SHA: ${{ steps.pins.outputs.corpus_sha }}
          PINNED_TYPESCRIPT_VERSION: ${{ steps.pins.outputs.typescript_version }}
          TYPESCRIPT_PLATFORM_PACKAGE: ${{ steps.pins.outputs.platform_package }}
          TYPESCRIPT_PLATFORM_VERSION: ${{ steps.pins.outputs.platform_version }}
        run: |
          mkdir -p cache-refresh
          touch cache-refresh/generate-tsc-cache.log
          {
            echo "schema_version=1"
            echo "repository=$GITHUB_REPOSITORY"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "ref=$GITHUB_REF"
            echo "sha=$GITHUB_SHA"
            echo "generator_outcome=${GENERATE_OUTCOME:-not-run}"
            echo "corpus_sha=${PINNED_CORPUS_SHA:-unknown}"
            echo "typescript_version=${PINNED_TYPESCRIPT_VERSION:-unknown}"
            echo "typescript_platform_package=${TYPESCRIPT_PLATFORM_PACKAGE:-unknown}"
            echo "typescript_platform_version=${TYPESCRIPT_PLATFORM_VERSION:-unknown}"
            echo "workers=2"
            echo "max_node_procs=2"
            echo "timeout_seconds=120"
            echo "node_version=$(node --version 2>/dev/null || echo unavailable)"
            echo "rustc_version=$(rustc --version 2>/dev/null || echo unavailable)"
            if [[ -f cache-refresh/tsc-cache-full.json ]]; then
              echo "cache_bytes=$(stat -c %s cache-refresh/tsc-cache-full.json)"
              echo "cache_sha256=$(sha256sum cache-refresh/tsc-cache-full.json | awk '{print $1}')"
            fi
            if [[ -f cache-refresh/conformance-domain.json ]]; then
              echo "domain_bytes=$(stat -c %s cache-refresh/conformance-domain.json)"
              echo "domain_sha256=$(sha256sum cache-refresh/conformance-domain.json | awk '{print $1}')"
            fi
            sha256sum Cargo.lock scripts/conformance/typescript-versions.json \
              scripts/ci/typescript-submodule-ref 2>/dev/null || true
          } > cache-refresh/metadata.txt

      - name: Upload TypeScript 7 cache and domain
        if: ${{ steps.generate.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ts7-conformance-cache
          path: |
            cache-refresh/tsc-cache-full.json
            cache-refresh/conformance-domain.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload cache-refresh metadata and log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ts7-conformance-cache-metadata
          path: |
            cache-refresh/metadata.txt
            cache-refresh/generate-tsc-cache.log
          if-no-files-found: error
          retention-days: 30

  ci-summary:
    name: CI Summary
    needs:
      - clippy
      - unit
      - conformance
      - conformance-aggregate
      - emit
      - emit-aggregate
      - fourslash
      - fourslash-aggregate
      - arch-size
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.refresh_tsc_cache != true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify core CI jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          required = {
              "clippy",
              "unit",
              "conformance",
              "conformance-aggregate",
              "emit",
              "emit-aggregate",
              "fourslash",
              "fourslash-aggregate",
              "arch-size",
          }

          # On pull_request the heavy jobs are intentionally skipped: the merge
          # campaign validates PRs via local delta-verified trains, and the full
          # suite still runs on merge_group / push-to-main / workflow_dispatch.
          # So "skipped" counts as a pass ONLY for pull_request; a real failure or
          # cancellation still fails, and every non-PR event stays strict.
          allow_skipped = os.environ.get("EVENT_NAME") == "pull_request"
          passing = {"success", "skipped"} if allow_skipped else {"success"}

          failures = []
          for name in sorted(required):
              result = needs.get(name, {}).get("result")
              if result not in passing:
                  failures.append(f"{name}: {result}")

          if failures:
              print("Required CI jobs did not pass:")
              for failure in failures:
                  print(f"  - {failure}")
              sys.exit(1)

          if allow_skipped:
              print("PR event: heavy jobs skipped by design; core gate passes.")
          else:
              print("Clippy, unit, conformance, emit, and fourslash checks passed.")
          PY
