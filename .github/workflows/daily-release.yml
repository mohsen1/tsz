name: Daily release unavailable during rewrite

# Scheduled version bumps, release PRs, tags, and downstream publication are
# disabled while the clean-slate compiler is an R0 validation artifact. This
# workflow remains manually visible so the unavailable state is unambiguous.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unavailable:
    name: Release automation is intentionally unavailable
    runs-on: ubuntu-latest
    steps:
      - name: Explain the rewrite release gate
        shell: bash
        run: |
          echo "::error title=TSZ release automation unavailable::The clean-slate compiler is not publishable. Scheduled version bumps, release PRs, tags, and publication remain disabled until an explicit release-readiness decision."
          exit 1
