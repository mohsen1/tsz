name: Campaign Flag Lane

# Exercises the #14344/#14345 identity + materialize-once campaign's default-OFF
# flag stack (issue #15317). The campaign's asset is almost entirely flag-ON
# behavior that nothing exercised; this lane runs the committed gauge so flag-ON
# parity and run-to-run determinism are re-proven as solver/checker main moves.
#
# Runs on a nightly schedule or manual dispatch. PR CI stays limited to the
# core compiler checks in `ci.yml`.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Gauge mode to run
        required: true
        default: all
        type: choice
        options:
          - all
          - flag-tests
          - determinism
          - census
permissions:
  contents: read

concurrency:
  group: campaign-flag-lane-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gauge:
    name: campaign gauge
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Install cargo-nextest
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2
        with:
          tool: cargo-nextest
      - name: Run campaign gauge
        shell: bash
        run: scripts/bench/campaign-gauge/run.sh "${{ github.event.inputs.mode || 'all' }}"
