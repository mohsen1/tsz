name: Bench

on:
  workflow_dispatch:
    inputs:
      filter:
        description: "Regex of bench-vs-tsgo rows to run"
        required: false
        default: "^(DeepPartial optional-chain N=400|Recursive utility aliases N=120|Shallow optional-chain N=400|utility-types-project|rxjs-project)$"
        type: string
      full_suite:
        description: "Run the full benchmark suite instead of --quick"
        required: false
        default: false
        type: boolean
      redeploy_site:
        description: "Trigger the GitHub Pages site rebuild after uploading results"
        required: false
        default: true
        type: boolean
  schedule:
    # Daily full benchmark run that publishes fresh rows to the website.
    # Runtime has grown from ~2h (when this was tuned to 03:00) to a measured
    # 3h50m-4h56m plus 45-75min of scheduler queue delay (#17561), so a 03:00
    # start was finishing at 08:44-09:54 -- after the 06:00 gh-pages deploy,
    # which then republished the *previous* day's artifact. Set to 22:00 UTC
    # (previous day, by cron's clock) so the run has ~8h of budget before
    # 06:00, comfortably covering the current worst-case queue delay + full
    # suite. gh-pages.yml's own `workflow_run: [Bench]` trigger also
    # redeploys as soon as this run completes and its artifact is
    # readiness-clean, independent of this cron -- this schedule only decides
    # whether the *06:00 scheduled* gh-pages run already has same-day data
    # rather than falling back to the still-fresh previous run. The
    # `bench-<ref>` concurrency group keeps this to one run at a time.
    - cron: "0 22 * * *"

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  issues: read

env:
  BENCH_PGO: "0"
  BENCH_REQUIRE_PGO: "0"
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  TSZ_BENCH_PROJECT_SLOWDOWN_FAILURE_FACTOR: "0"

jobs:
  bench:
    name: GitHub Actions benchmark
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (inputs.full_suite || github.event_name == 'schedule') && 360 || 120 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target
            . -> .target-bench

      - name: Install benchmark tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq bc git curl pkg-config libssl-dev
          if ! sudo apt-get install -y hyperfine; then
            cargo install hyperfine --locked
          fi
          # `large-ts-repo` is a pnpm workspace: its fixture runs
          # `pnpm install --frozen-lockfile` (scripts/bench/lib/large-ts-repo-fixture.sh).
          # Without pnpm that fixture aborts before writing its flat tsconfig, so
          # the row — declared `benchmark_set: "required"` — silently drops out
          # of every scheduled run while the job still reports success.
          if ! command -v pnpm >/dev/null 2>&1; then
            corepack enable pnpm || npm install -g pnpm
          fi
          pnpm --version

      - name: Run bench-vs-tsgo on GitHub Actions
        shell: bash
        env:
          BENCH_FILTER: ${{ inputs.filter }}
          FULL_SUITE: ${{ inputs.full_suite || github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          mkdir -p bench-out
          args=(--json --json-file "$GITHUB_WORKSPACE/bench-results.json")
          if [[ "${FULL_SUITE}" != "true" ]]; then
            args+=(--quick)
          fi
          if [[ -n "${BENCH_FILTER}" ]]; then
            args+=(--filter "${BENCH_FILTER}")
          fi
          scripts/bench/bench-vs-tsgo.sh "${args[@]}"

      - name: Summarize green tsgo winners
        shell: bash
        run: |
          set -euo pipefail
          node scripts/bench/tsgo-winner-report.mjs \
            "$GITHUB_WORKSPACE/bench-results.json" \
            "$GITHUB_WORKSPACE/bench-results-tsgo-winners.json" \
            "$GITHUB_WORKSPACE/bench-results-missing-attribution.md"

      - name: Check public benchmark readiness
        id: readiness
        shell: bash
        run: |
          set -euo pipefail
          if node scripts/bench/check-artifact-readiness.mjs \
            --json \
            --require-application-compat \
            --require-green-project-timing-pairs \
            --require-project-timing-pairs=1 \
            --expect-source-commit="${GITHUB_SHA}" \
            "$GITHUB_WORKSPACE/bench-results.json" \
            > "$GITHUB_WORKSPACE/bench-results-readiness.json"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            cat "$GITHUB_WORKSPACE/bench-results-readiness.json" || true
          fi

      - name: Upload merged benchmark artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results-merged
          path: |
            bench-results.json
            bench-results-tsgo-winners.json
            bench-results-missing-attribution.md
            bench-results-readiness.json
          retention-days: 30
          if-no-files-found: error
          compression-level: 1

      # Only the daily scheduled run publishes: it always runs the full suite
      # (empty filter), so it can never overwrite the site with a partial set.
      # Manual dispatches — including filtered ones for spot-checking specific
      # rows — never auto-publish; to publish a chosen run, dispatch
      # bench-republish.yml with its run id. (A filtered dispatch previously
      # replaced the full dataset with just its handful of rows.)
      - name: Trigger website redeploy
        if: ${{ github.event_name == 'schedule' && steps.readiness.outputs.ready == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if ! curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 15 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/gh-pages.yml/dispatches" \
            -d '{"ref":"main"}'; then
            echo "::warning::Website redeploy dispatch failed after retries; benchmark data is uploaded as a GitHub Actions artifact."
          fi
