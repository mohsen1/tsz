name: Bench

on:
  # Perf is measured per-tip on a cadence (not per-commit): each tick benches the
  # current main HEAD (github.sha). Dropping the per-CI-completion workflow_run
  # trigger removes the batch-supersession + defer/catch-up machinery — the
  # schedule itself is the catch-up (the next tick measures the newest tip).
  schedule:
    - cron: '30 */3 * * *'   # perf cadence: bench current main tip every 3h
    # Daily latest PGO release: submit the Cloud Build prep first, then publish
    # the finished artifact without fanning out benchmark shards.
    - cron: '0 3 * * *'
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      publish_latest_pgo:
        description: "Publish the latest PGO channel asset from this run"
        required: false
        default: false
        type: boolean

# Single-flight per channel. cancel-in-progress:false lets an in-flight bench
# finish (a ~2h run is never thrown away); at most one newer run queues behind it
# and benches the then-current tip. Perf and the daily PGO release use separate
# groups so a long perf run never delays the release (and vice versa).
concurrency:
  group: bench-${{ (github.event.schedule == '0 3 * * *' || github.event.schedule == '0 5 * * *' || (github.event_name == 'workflow_dispatch' && inputs.publish_latest_pgo)) && 'release' || 'perf' }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  issues: write

env:
  _TSZ_CI_CACHE_BUCKET: gs://thirdface-ai-oauth_cloudbuild/tsz-ci-cache
  BENCH_FULL: "1"
  BENCH_COLD: "1"
  BENCH_PGO: "1"
  BENCH_REQUIRE_PGO: "1"
  HYPERFINE_VER: "1.18.0"
  # Per-tip cadence: github.sha is main's HEAD at trigger time for schedule /
  # workflow_dispatch on the default branch, so the whole pipeline measures and
  # publishes the current tip. The cadence + the latest.json source-monotonic
  # guard replace the old age/stale/catch-up knobs (all removed).
  GITHUB_SHA: ${{ github.sha }}
  BENCH_TARGET_SHA: ${{ github.sha }}
  # Build image for the prepare/shard Cloud Builds. Empty (default) falls back to
  # rust:1.95 + the inline bootstrap; set the BENCH_IMAGE_REF repo variable to a
  # prebuilt bench base image to remove the per-build bootstrap SPOF (#13751; see
  # scripts/infra/bench-base/README.md).
  BENCH_IMAGE_REF: ${{ vars.BENCH_IMAGE_REF }}
  CARGO_HOME: ${{ github.workspace }}/.ci-cache/cargo-home
  npm_config_cache: ${{ github.workspace }}/.ci-cache/npm
  PNPM_STORE_DIR: ${{ github.workspace }}/.ci-cache/pnpm-store

jobs:
  bench-gate:
    name: bench-gate
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Single-flight is enforced entirely by the workflow `concurrency` group
          # (group bench-<perf|release>, cancel-in-progress:false): at most one
          # perf bench runs, and at most one newer tick queues behind it to measure
          # the next tip. No gate-side dedup is needed (a channel-blind dedup here
          # would let a long daily-release run false-skip a perf tick); this job
          # only exposes should_run for the downstream `if:` conditions.
          echo "should_run=true" >> "$GITHUB_OUTPUT"

  bench-prepare:
    name: bench-prepare
    needs: bench-gate
    if: >-
      needs.bench-gate.outputs.should_run == 'true' &&
      vars.TSZ_BENCH_SELF_HOSTED_PREP == '1' &&
      !((github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') ||
        (github.event_name == 'schedule' && github.event.schedule == '0 5 * * *') ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_latest_pgo))
    runs-on: [self-hosted, tsz-cloud-run]
    timeout-minutes: 30
    outputs:
      should_run: ${{ steps.prepare-gate.outputs.should_run }}
      build_id: ${{ steps.cloudbuild-submit.outputs.build_id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.BENCH_TARGET_SHA }}
          fetch-depth: 1

      - id: prepare-gate
        name: Confirm benchmark should proceed
        shell: bash
        run: echo "should_run=true" >> "$GITHUB_OUTPUT"

      - id: cloudbuild-submit
        name: Submit benchmark prep to Cloud Build pool
        if: steps.prepare-gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          target_sha="${{ env.BENCH_TARGET_SHA }}"
          manifest_value() {
            local key="$1"
            awk -v key="$key" '
              index($0, key "=") == 1 { value = substr($0, length(key) + 2) }
              END { print value }
            ' bench-prep.env
          }

          rm -f bench-prep.env bench-prep.tar
          if gcloud storage cp \
              "gs://tsz-ci_cloudbuild/bench-prep/${target_sha}/bench-prep.env" \
              bench-prep.env >/dev/null 2>&1 && \
            gcloud storage cp \
              "gs://tsz-ci_cloudbuild/bench-prep/${target_sha}/bench-prep.tar" \
              bench-prep.tar >/dev/null 2>&1; then
            manifest_target_sha="$(manifest_value BENCH_TARGET_SHA)"
            manifest_pgo_optimized="$(manifest_value BENCH_PGO_OPTIMIZED)"
            if [[ "${manifest_target_sha}" == "${target_sha}" &&
                  "${manifest_pgo_optimized}" == "1" ]] && \
              tar -tf bench-prep.tar .target-bench/dist/tsz >/dev/null && \
              tar -tf bench-prep.tar .target-bench/dist/.bench-pgo-optimized >/dev/null; then
              echo "Cloud Build PGO prep artifact already exists for ${target_sha}; skipping submit."
              exit 0
            fi
            echo "Existing Cloud Build PGO prep artifact is incomplete or stale; submitting a fresh build."
          fi

          submit_output="$(gcloud builds submit \
            --async \
            --project=tsz-ci \
            --region=us-central1 \
            --config=scripts/cloudbuild/cloudbuild-bench-prepare.yaml \
            --gcs-source-staging-dir=gs://tsz-ci_cloudbuild/cb-source-staging \
            --substitutions=_BENCH_TARGET_SHA="${target_sha}",_BENCH_IMAGE="${BENCH_IMAGE_REF:-rust:1.95}" \
            --format='value(id)' \
            .)"
          build_id="$(grep -Eo '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' <<<"$submit_output" | tail -n 1 || true)"
          if [[ -z "$build_id" ]]; then
            printf '%s\n' "$submit_output"
            echo "Cloud Build submit did not return a build id." >&2
            exit 1
          fi
          echo "Submitted Cloud Build benchmark prep ${build_id}."
          echo "build_id=${build_id}" >> "$GITHUB_OUTPUT"

  bench-prepare-cloudbuild:
    name: bench-prepare-cloudbuild
    needs: bench-gate
    if: >-
      needs.bench-gate.outputs.should_run == 'true' &&
      !(github.event_name == 'schedule' && github.event.schedule == '0 5 * * *') &&
      (vars.TSZ_BENCH_SELF_HOSTED_PREP != '1' ||
       (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') ||
       (github.event_name == 'workflow_dispatch' && inputs.publish_latest_pgo))
    runs-on: [self-hosted, tsz-cloud-run]
    timeout-minutes: 120
    outputs:
      should_run: ${{ steps.prepare-gate.outputs.should_run }}
      build_id: ${{ steps.cloudbuild-submit.outputs.build_id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.BENCH_TARGET_SHA }}
          fetch-depth: 1

      - id: prepare-gate
        name: Confirm benchmark should proceed
        shell: bash
        run: |
          # The bench-gate job handles supersession before Cloud Build submit.
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - id: cloudbuild-submit
        name: Submit benchmark prep to Cloud Build pool
        shell: bash
        run: |
          set -euo pipefail

          target_sha="${{ env.BENCH_TARGET_SHA }}"
          manifest_value() {
            local key="$1"
            awk -v key="$key" '
              index($0, key "=") == 1 { value = substr($0, length(key) + 2) }
              END { print value }
            ' bench-prep.env
          }

          prep_prefix="latest"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" &&
                "${{ inputs.publish_latest_pgo }}" != "true" ]]; then
            prep_prefix="${target_sha}"
          fi

          rm -f bench-prep.env bench-prep.tar
          if gcloud storage cp \
            "gs://tsz-ci_cloudbuild/bench-prep/${prep_prefix}/bench-prep.env" \
            bench-prep.env >/dev/null 2>&1 && \
            gcloud storage cp \
              "gs://tsz-ci_cloudbuild/bench-prep/${prep_prefix}/bench-prep.tar" \
              bench-prep.tar >/dev/null 2>&1; then
            manifest_target_sha="$(manifest_value BENCH_TARGET_SHA)"
            manifest_build_date="$(manifest_value BENCH_BUILD_DATE)"
            manifest_pgo_optimized="$(manifest_value BENCH_PGO_OPTIMIZED)"
            if [[ "${manifest_target_sha}" == "${target_sha}" &&
                  "${manifest_build_date}" == "$(date -u +%F)" &&
                  "${manifest_pgo_optimized}" == "1" ]] && \
                tar -tf bench-prep.tar .target-bench/dist/tsz >/dev/null && \
                tar -tf bench-prep.tar .target-bench/dist/.bench-pgo-optimized >/dev/null; then
              echo "Cloud Build prep artifact already exists for ${target_sha}; skipping submit."
              exit 0
            fi
            echo "Existing Cloud Build prep artifact is incomplete or stale; submitting a fresh build."
            rm -f bench-prep.env bench-prep.tar
          fi

          submit_output="$(gcloud builds submit \
            --async \
            --project=tsz-ci \
            --region=us-central1 \
            --config=scripts/cloudbuild/cloudbuild-bench-prepare.yaml \
            --gcs-source-staging-dir=gs://tsz-ci_cloudbuild/cb-source-staging \
            --substitutions=_BENCH_TARGET_SHA="${target_sha}",_BENCH_IMAGE="${BENCH_IMAGE_REF:-rust:1.95}" \
            --format='value(id)' \
            .)"
          build_id="$(grep -Eo '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' <<<"$submit_output" | tail -n 1 || true)"
          if [[ -z "$build_id" ]]; then
            printf '%s\n' "$submit_output"
            echo "Cloud Build submit did not return a build id." >&2
            exit 1
          fi
          echo "Submitted Cloud Build benchmark prep ${build_id}."
          echo "build_id=${build_id}" >> "$GITHUB_OUTPUT"

  publish-latest-pgo:
    name: publish-latest-pgo
    needs: [bench-gate, bench-prepare-cloudbuild]
    if: >-
      always() &&
      needs.bench-gate.outputs.should_run == 'true' &&
      ((github.event_name == 'schedule' && github.event.schedule == '0 5 * * *') ||
       (github.event_name == 'workflow_dispatch' && inputs.publish_latest_pgo))
    runs-on: [self-hosted, tsz-cloud-run]
    timeout-minutes: 25
    env:
      LATEST_TAG: latest
      LATEST_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - id: cloudbuild-artifact
        name: Download Cloud Build prep artifact
        shell: bash
        run: |
          set -euo pipefail

          wait_seconds=900
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            wait_seconds=360
          fi

          storage_cp() {
            timeout 45s gcloud storage cp "$1" "$2" >/dev/null 2>&1
          }

          manifest_value() {
            local file="$1"
            local key="$2"
            grep -E "^${key}=" "${file}" | tail -n1 | cut -d= -f2-
          }

          target_sha="${{ env.BENCH_TARGET_SHA }}"
          deadline=$((SECONDS + wait_seconds))
          while true; do
            rm -f latest-bench-prep.env bench-prep.env bench-prep.tar
            if storage_cp \
              "gs://tsz-ci_cloudbuild/bench-prep/latest/bench-prep.env" \
              latest-bench-prep.env; then
              latest_target_sha="$(manifest_value latest-bench-prep.env BENCH_TARGET_SHA)"
              latest_build_date="$(manifest_value latest-bench-prep.env BENCH_BUILD_DATE)"
              latest_pgo_optimized="$(manifest_value latest-bench-prep.env BENCH_PGO_OPTIMIZED)"
              if [[ -z "${latest_target_sha}" ]]; then
                echo "Cloud Build manifest did not include BENCH_TARGET_SHA."
                exit 1
              fi
              if [[ "${latest_pgo_optimized}" != "1" ]]; then
                echo "Cloud Build latest manifest is not marked PGO optimized."
                exit 1
              fi

              if [[ "${{ github.event_name }}" == "workflow_dispatch" &&
                    "${latest_target_sha}" != "${target_sha}" ]]; then
                echo "Cloud Build artifact is for ${latest_target_sha}; waiting for ${target_sha}."
              elif [[ "${{ github.event_name }}" == "schedule" &&
                      "${latest_build_date}" != "$(date -u +%F)" ]]; then
                echo "Cloud Build artifact is from ${latest_build_date:-unknown}; waiting for today's build."
              elif storage_cp \
                "gs://tsz-ci_cloudbuild/bench-prep/${latest_target_sha}/bench-prep.env" \
                bench-prep.env && \
                storage_cp \
                  "gs://tsz-ci_cloudbuild/bench-prep/${latest_target_sha}/bench-prep.tar" \
                  bench-prep.tar; then
                scoped_target_sha="$(manifest_value bench-prep.env BENCH_TARGET_SHA)"
                scoped_build_date="$(manifest_value bench-prep.env BENCH_BUILD_DATE)"
                scoped_pgo_optimized="$(manifest_value bench-prep.env BENCH_PGO_OPTIMIZED)"
                if [[ "${scoped_target_sha}" != "${latest_target_sha}" ]]; then
                  echo "SHA-scoped Cloud Build manifest is for ${scoped_target_sha:-unknown}; expected ${latest_target_sha}."
                  exit 1
                fi
                if [[ "${scoped_build_date}" != "${latest_build_date}" ]]; then
                  echo "SHA-scoped Cloud Build manifest date ${scoped_build_date:-unknown} did not match latest date ${latest_build_date:-unknown}."
                  exit 1
                fi
                if [[ "${scoped_pgo_optimized}" != "1" ]]; then
                  echo "SHA-scoped Cloud Build manifest is not marked PGO optimized."
                  exit 1
                fi
                tar -tf bench-prep.tar .target-bench/dist/tsz >/dev/null
                tar -tf bench-prep.tar .target-bench/dist/.bench-pgo-optimized >/dev/null
                echo "target_sha=${latest_target_sha}" >> "$GITHUB_OUTPUT"
                echo "ready=true" >> "$GITHUB_OUTPUT"
                exit 0
              else
                echo "SHA-scoped Cloud Build artifact for ${latest_target_sha} is not available yet."
              fi
            fi

            if (( SECONDS >= deadline )); then
              echo "No finished Cloud Build PGO artifact is available yet."
              if [[ "${{ github.event_name }}" == "schedule" ]]; then
                exit 1
              fi
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Waiting for Cloud Build PGO artifact..."
            sleep 30
          done

      - name: Stage latest PGO release asset
        if: steps.cloudbuild-artifact.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail

          tar -xf bench-prep.tar
          test -x .target-bench/dist/tsz
          test -f .target-bench/dist/.bench-pgo-optimized

          staging="tsz-${LATEST_TAG}-${LATEST_TARGET}"
          mkdir -p "dist/${staging}"
          cp .target-bench/dist/tsz "dist/${staging}/"
          cp README.md LICENSE 2>/dev/null "dist/${staging}/" || true
          tar -C dist -czf "dist/${staging}.tar.gz" "${staging}"
          sha256sum "dist/${staging}.tar.gz" | awk '{print $1}' > "dist/${staging}.tar.gz.sha256"
          (
            cd dist
            printf "%s  %s\n" \
              "$(cat "${staging}.tar.gz.sha256")" \
              "${staging}.tar.gz" > SHA256SUMS
          )
          ls -la dist/

      - name: Publish latest channel release
        if: steps.cloudbuild-artifact.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TARGET_SHA: ${{ steps.cloudbuild-artifact.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags --depth=1 origin "${RELEASE_TARGET_SHA}"

          python3 <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          api = "https://api.github.com"
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["LATEST_TAG"]
          token = os.environ["GITHUB_TOKEN"]

          def github_json(method, path, body=None, allow_404=False, expect=None):
              data = None
              headers = {
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              if body is not None:
                  data = json.dumps(body).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(f"{api}{path}", data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req) as resp:
                      raw = resp.read()
                      payload = json.loads(raw.decode("utf-8")) if raw else None
                      if expect is not None and resp.status != expect:
                          raise RuntimeError(f"{method} {path} returned {resp.status}, expected {expect}")
                      return resp.status, payload
              except urllib.error.HTTPError as exc:
                  if allow_404 and exc.code == 404:
                      return exc.code, None
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"{method} {path} failed with HTTP {exc.code}: {detail}") from exc

          status, release = github_json(
              "GET",
              f"/repos/{repo}/releases/tags/{tag}",
              allow_404=True,
          )
          if status == 200:
              github_json("DELETE", f"/repos/{repo}/releases/{release['id']}", expect=204)
          PY
          git tag -f "${LATEST_TAG}" "${RELEASE_TARGET_SHA}"
          git push origin "refs/tags/${LATEST_TAG}" --force

          python3 <<'PY'
          import json
          import mimetypes
          import os
          import pathlib
          import urllib.error
          import urllib.parse
          import urllib.request

          api = "https://api.github.com"
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["LATEST_TAG"]
          target = os.environ["LATEST_TARGET"]
          sha = os.environ["RELEASE_TARGET_SHA"]
          token = os.environ["GITHUB_TOKEN"]

          def github_request(method, url_or_path, body=None, content_type="application/json", expect=None):
              url = url_or_path if url_or_path.startswith("https://") else f"{api}{url_or_path}"
              headers = {
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              data = body
              if content_type == "application/json":
                  data = json.dumps(body).encode("utf-8") if body is not None else None
              if content_type:
                  headers["Content-Type"] = content_type
              if data is not None:
                  headers["Content-Length"] = str(len(data))
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req) as resp:
                      raw = resp.read()
                      payload = json.loads(raw.decode("utf-8")) if raw else None
                      if expect is not None and resp.status != expect:
                          raise RuntimeError(f"{method} {url} returned {resp.status}, expected {expect}")
                      return resp.status, payload
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"{method} {url} failed with HTTP {exc.code}: {detail}") from exc

          _, release = github_request(
              "POST",
              f"/repos/{repo}/releases",
              {
                  "tag_name": tag,
                  "target_commitish": sha,
                  "name": "latest",
                  "body": f"Daily PGO optimized tsz build for {target}, built from {sha}.",
                  "prerelease": True,
                  "make_latest": "false",
              },
              expect=201,
          )
          upload_url = release["upload_url"].split("{", 1)[0]
          assets = [
              pathlib.Path(f"dist/tsz-{tag}-{target}.tar.gz"),
              pathlib.Path(f"dist/tsz-{tag}-{target}.tar.gz.sha256"),
              pathlib.Path("dist/SHA256SUMS"),
          ]
          for asset in assets:
              name = asset.name
              content_type = mimetypes.guess_type(name)[0] or "application/octet-stream"
              data = asset.read_bytes()
              params = urllib.parse.urlencode({"name": name})
              github_request(
                  "POST",
                  f"{upload_url}?{params}",
                  data,
                  content_type=content_type,
                  expect=201,
              )
          PY

      - name: Smoke test latest installer
        if: steps.cloudbuild-artifact.outputs.ready == 'true'
        shell: bash
        env:
          TSZ_REPO_OWNER: ${{ github.repository_owner }}
          TSZ_REPO_NAME: ${{ github.event.repository.name }}
          TSZ_INSTALL_REQUIRE_LATEST_CHANNEL: "1"
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/tsz-latest-install"
          bash scripts/install.sh --version latest --dir "${install_dir}"
          "${install_dir}/tsz" --version

  bench-prep-artifact:
    name: bench-prep-artifact
    needs: [bench-prepare, bench-prepare-cloudbuild]
    if: >-
      always() &&
      (needs.bench-prepare.outputs.should_run == 'true' ||
       (!(github.event_name == 'workflow_dispatch' && inputs.publish_latest_pgo) &&
        !(github.event_name == 'schedule' && github.event.schedule == '0 5 * * *') &&
        needs.bench-prepare-cloudbuild.outputs.should_run == 'true')) &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: [self-hosted, tsz-cloud-run]
    timeout-minutes: 170
    steps:
      - name: Download Cloud Build prep artifact
        if: needs.bench-prepare.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          target_sha="${{ env.BENCH_TARGET_SHA }}"
          manifest_value() {
            local key="$1"
            awk -v key="$key" '
              index($0, key "=") == 1 { value = substr($0, length(key) + 2) }
              END { print value }
            ' bench-prep.env
          }
          storage_cp() {
            timeout 45s gcloud storage cp "$1" "$2" >/dev/null 2>&1
          }
          copy_from_cloudbuild_manifest() {
            local target_sha="$1"
            local manifest_file=cloudbuild-artifacts.json
            local manifest_paths=cloudbuild-artifacts.env

            [[ -n "$cloudbuild_id" ]] || return 1
            storage_cp "gs://tsz-ci_cloudbuild/artifacts-${cloudbuild_id}.json" "$manifest_file" || return 1
            if ! node - "$manifest_file" "$target_sha" > "$manifest_paths" <<'NODE'
          const fs = require("node:fs");

          const [manifestPath, targetSha] = process.argv.slice(2);
          const rawManifest = fs.readFileSync(manifestPath, "utf8").trim();
          const parseManifest = (raw) => {
            if (!raw) return [];
            try {
              return JSON.parse(raw);
            } catch (jsonError) {
              return raw.split(/\r?\n/)
                .map((line) => line.trim())
                .filter(Boolean)
                .map((line, index) => {
                  try {
                    return JSON.parse(line);
                  } catch (lineError) {
                    lineError.message = `Could not parse Cloud Build artifact manifest line ${index + 1}: ${lineError.message}`;
                    throw lineError;
                  }
                });
            }
          };
          const collectEntries = (manifest) => {
            const queue = Array.isArray(manifest) ? [...manifest] : [manifest];
            const entries = [];
            for (const entry of queue) {
              if (!entry || typeof entry !== "object") continue;
              if (entry.location) entries.push(entry);
              for (const key of ["artifacts", "results", "objects", "files"]) {
                if (Array.isArray(entry[key])) queue.push(...entry[key]);
              }
            }
            return entries;
          };
          const entries = collectEntries(parseManifest(rawManifest));
          const locationOf = (entry) => String(entry.location || "").split("#", 1)[0];
          const findLocation = (suffixes) => {
            for (const suffix of suffixes) {
              const match = entries.find((entry) => locationOf(entry).endsWith(suffix));
              if (match) return locationOf(match);
            }
            return "";
          };
          const env = findLocation([
            `/bench-prep/${targetSha}/bench-prep.env`,
            `bench-prep/${targetSha}/bench-prep.env`,
            "/bench-prep/${_BENCH_TARGET_SHA}/bench-prep.env",
            "bench-prep/${_BENCH_TARGET_SHA}/bench-prep.env",
            "/bench-prep/latest/bench-prep.env",
            "bench-prep/latest/bench-prep.env",
            "/bench-prep.env",
            "bench-prep.env",
          ]);
          const tar = findLocation([
            `/bench-prep/${targetSha}/bench-prep.tar`,
            `bench-prep/${targetSha}/bench-prep.tar`,
            "/bench-prep/${_BENCH_TARGET_SHA}/bench-prep.tar",
            "bench-prep/${_BENCH_TARGET_SHA}/bench-prep.tar",
            "/bench-prep/latest/bench-prep.tar",
            "bench-prep/latest/bench-prep.tar",
            "/bench-prep.tar",
            "bench-prep.tar",
          ]);
          if (!env || !tar) {
            console.error(`Cloud Build artifact manifest did not include bench prep env/tar for ${targetSha}.`);
            process.exit(1);
          }
          console.log(`manifest_env=${JSON.stringify(env)}`);
          console.log(`manifest_tar=${JSON.stringify(tar)}`);
          NODE
            then
              return 1
            fi
            # shellcheck disable=SC1090
            source "$manifest_paths"
            [[ -n "${manifest_env:-}" && -n "${manifest_tar:-}" ]] || return 1
            storage_cp "$manifest_env" bench-prep.env && storage_cp "$manifest_tar" bench-prep.tar
          }
          validate_downloaded_prep_artifact() {
            tar -tf bench-prep.tar .target-bench/dist/tsz >/dev/null || return 1
            tar -tf bench-prep.tar .target-bench/dist/.bench-pgo-optimized >/dev/null || return 1
            manifest_target_sha="$(manifest_value BENCH_TARGET_SHA)"
            manifest_pgo_optimized="$(manifest_value BENCH_PGO_OPTIMIZED)"
            [[ "${manifest_target_sha}" == "${target_sha}" &&
              "${manifest_pgo_optimized}" == "1" ]]
          }
          copy_from_latest_prep_artifact() {
            rm -f latest-bench-prep.env bench-prep.env bench-prep.tar
            storage_cp \
              "gs://tsz-ci_cloudbuild/bench-prep/latest/bench-prep.env" \
              latest-bench-prep.env || return 1
            storage_cp \
              "gs://tsz-ci_cloudbuild/bench-prep/latest/bench-prep.tar" \
              bench-prep.tar || return 1
            mv latest-bench-prep.env bench-prep.env
            validate_downloaded_prep_artifact
          }
          cloudbuild_status() {
            local build_id="$1"
            [[ -n "$build_id" ]] || return 0
            # gcloud can take a transient SIGPIPE from its internal pipes during
            # Cloud Build polling; under pipefail that escapes as a fatal step
            # exit 141 that kills the wait before the signed artifact is fetched,
            # leaving an unsigned stale JSON that merge-results rejects (so
            # bench-publish fails). Ignore SIGPIPE and capture with pipefail off
            # so a poll hiccup yields an empty status (the caller retries).
            # (Same SIGPIPE-fix family as #14449 / #14476.)
            trap '' PIPE
            local out
            out="$(set +o pipefail; gcloud builds describe "$build_id" \
              --project=tsz-ci \
              --region=us-central1 \
              --format='value(status)' 2>/dev/null)" || out=""
            printf '%s\n' "$out"
          }
          capture_cloudbuild_log() {
            local build_id="$1"
            [[ -n "$build_id" ]] || return 0
            gcloud builds log "$build_id" \
              --project=tsz-ci \
              --region=us-central1 \
              > bench-prep-cloudbuild.log 2>&1 || true
          }
          cloudbuild_id="${{ needs.bench-prepare.outputs.build_id }}"

          deadline=$((SECONDS + 9000))
          success_seen_at=""
          success_grace_seconds=7200
          while true; do
            rm -f bench-prep.env bench-prep.tar
            if storage_cp \
              "gs://tsz-ci_cloudbuild/bench-prep/${target_sha}/bench-prep.env" \
              bench-prep.env && \
              storage_cp \
                "gs://tsz-ci_cloudbuild/bench-prep/${target_sha}/bench-prep.tar" \
                bench-prep.tar; then
              if validate_downloaded_prep_artifact; then
                exit 0
              fi
              echo "Cloud Build prep artifact is for ${manifest_target_sha:-unknown} / PGO=${manifest_pgo_optimized:-0}; waiting for ${target_sha}."
            fi

            status="$(cloudbuild_status "$cloudbuild_id")"
            if [[ "$status" == "SUCCESS" ]]; then
              if [[ -z "$success_seen_at" ]]; then
                success_seen_at="$SECONDS"
                echo "Cloud Build benchmark prep ${cloudbuild_id} succeeded; waiting up to ${success_grace_seconds}s for prep artifacts to become visible."
              fi
              if copy_from_latest_prep_artifact; then
                exit 0
              fi
              if copy_from_cloudbuild_manifest "$target_sha"; then
                if validate_downloaded_prep_artifact; then
                  exit 0
                fi
                echo "Cloud Build benchmark prep ${cloudbuild_id} manifest artifact is for ${manifest_target_sha:-unknown} / PGO=${manifest_pgo_optimized:-0}; waiting for ${target_sha} / PGO=1."
              fi
              if (( SECONDS - success_seen_at >= success_grace_seconds )); then
                echo "Cloud Build benchmark prep ${cloudbuild_id} succeeded, but neither SHA-scoped, latest, nor manifest artifacts exposed valid bench-prep env/tar for ${target_sha} after ${success_grace_seconds}s."
                capture_cloudbuild_log "$cloudbuild_id"
                exit 1
              fi
            fi
            case "$status" in
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "Cloud Build benchmark prep ${cloudbuild_id} ended with status ${status}; artifact is unavailable."
                capture_cloudbuild_log "$cloudbuild_id"
                exit 1
                ;;
            esac

            if (( SECONDS >= deadline )); then
              echo "No finished Cloud Build PGO prep artifact is available for ${target_sha} after 150 minutes."
              [[ -z "$status" ]] || echo "Last Cloud Build benchmark prep status: ${status} (${cloudbuild_id})."
              capture_cloudbuild_log "$cloudbuild_id"
              exit 1
            fi

            echo "Waiting for Cloud Build benchmark prep artifact (build=${cloudbuild_id:-none}, status=${status:-unknown}, target=${target_sha}, elapsed=${SECONDS}s)..."
            sleep 30
          done

      - name: Download Cloud Build prep artifact
        if: >-
          needs.bench-prepare.outputs.should_run != 'true' &&
          needs.bench-prepare-cloudbuild.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          storage_cp() {
            timeout 45s gcloud storage cp "$1" "$2" >/dev/null 2>&1
          }
          manifest_value() {
            local key="$1"
            awk -v key="$key" '
              index($0, key "=") == 1 { value = substr($0, length(key) + 2) }
              END { print value }
            ' bench-prep.env
          }
          copy_from_cloudbuild_manifest() {
            local target_sha="$1"
            local manifest_file=cloudbuild-artifacts.json
            local manifest_paths=cloudbuild-artifacts.env

            [[ -n "$cloudbuild_id" ]] || return 1
            storage_cp "gs://tsz-ci_cloudbuild/artifacts-${cloudbuild_id}.json" "$manifest_file" || return 1
            if ! node - "$manifest_file" "$target_sha" > "$manifest_paths" <<'NODE'
          const fs = require("node:fs");

          const [manifestPath, targetSha] = process.argv.slice(2);
          const rawManifest = fs.readFileSync(manifestPath, "utf8").trim();
          const parseManifest = (raw) => {
            if (!raw) return [];
            try {
              return JSON.parse(raw);
            } catch (jsonError) {
              return raw.split(/\r?\n/)
                .map((line) => line.trim())
                .filter(Boolean)
                .map((line, index) => {
                  try {
                    return JSON.parse(line);
                  } catch (lineError) {
                    lineError.message = `Could not parse Cloud Build artifact manifest line ${index + 1}: ${lineError.message}`;
                    throw lineError;
                  }
                });
            }
          };
          const collectEntries = (manifest) => {
            const queue = Array.isArray(manifest) ? [...manifest] : [manifest];
            const entries = [];
            for (const entry of queue) {
              if (!entry || typeof entry !== "object") continue;
              if (entry.location) entries.push(entry);
              for (const key of ["artifacts", "results", "objects", "files"]) {
                if (Array.isArray(entry[key])) queue.push(...entry[key]);
              }
            }
            return entries;
          };
          const entries = collectEntries(parseManifest(rawManifest));
          const locationOf = (entry) => String(entry.location || "").split("#", 1)[0];
          const findLocation = (suffixes) => {
            for (const suffix of suffixes) {
              const match = entries.find((entry) => locationOf(entry).endsWith(suffix));
              if (match) return locationOf(match);
            }
            return "";
          };
          const env = findLocation([
            `/bench-prep/${targetSha}/bench-prep.env`,
            `bench-prep/${targetSha}/bench-prep.env`,
            "/bench-prep/${_BENCH_TARGET_SHA}/bench-prep.env",
            "bench-prep/${_BENCH_TARGET_SHA}/bench-prep.env",
            "/bench-prep/latest/bench-prep.env",
            "bench-prep/latest/bench-prep.env",
            "/bench-prep.env",
            "bench-prep.env",
          ]);
          const tar = findLocation([
            `/bench-prep/${targetSha}/bench-prep.tar`,
            `bench-prep/${targetSha}/bench-prep.tar`,
            "/bench-prep/${_BENCH_TARGET_SHA}/bench-prep.tar",
            "bench-prep/${_BENCH_TARGET_SHA}/bench-prep.tar",
            "/bench-prep/latest/bench-prep.tar",
            "bench-prep/latest/bench-prep.tar",
            "/bench-prep.tar",
            "bench-prep.tar",
          ]);
          if (!env || !tar) {
            console.error(`Cloud Build artifact manifest did not include bench prep env/tar for ${targetSha}.`);
            process.exit(1);
          }
          console.log(`manifest_env=${JSON.stringify(env)}`);
          console.log(`manifest_tar=${JSON.stringify(tar)}`);
          NODE
            then
              return 1
            fi
            # shellcheck disable=SC1090
            source "$manifest_paths"
            [[ -n "${manifest_env:-}" && -n "${manifest_tar:-}" ]] || return 1
            storage_cp "$manifest_env" bench-prep.env && storage_cp "$manifest_tar" bench-prep.tar
          }
          validate_downloaded_prep_artifact() {
            tar -tf bench-prep.tar .target-bench/dist/tsz >/dev/null || return 1
            tar -tf bench-prep.tar .target-bench/dist/.bench-pgo-optimized >/dev/null || return 1
            manifest_target_sha="$(manifest_value BENCH_TARGET_SHA)"
            manifest_pgo_optimized="$(manifest_value BENCH_PGO_OPTIMIZED)"
            [[ "${manifest_target_sha}" == "${target_sha}" &&
              "${manifest_pgo_optimized}" == "1" ]]
          }
          copy_from_latest_prep_artifact() {
            rm -f latest-bench-prep.env bench-prep.env bench-prep.tar
            storage_cp \
              "gs://tsz-ci_cloudbuild/bench-prep/latest/bench-prep.env" \
              latest-bench-prep.env || return 1
            storage_cp \
              "gs://tsz-ci_cloudbuild/bench-prep/latest/bench-prep.tar" \
              bench-prep.tar || return 1
            mv latest-bench-prep.env bench-prep.env
            validate_downloaded_prep_artifact
          }
          cloudbuild_status() {
            local build_id="$1"
            [[ -n "$build_id" ]] || return 0
            # gcloud can take a transient SIGPIPE from its internal pipes during
            # Cloud Build polling; under pipefail that escapes as a fatal step
            # exit 141 that kills the wait before the signed artifact is fetched,
            # leaving an unsigned stale JSON that merge-results rejects (so
            # bench-publish fails). Ignore SIGPIPE and capture with pipefail off
            # so a poll hiccup yields an empty status (the caller retries).
            # (Same SIGPIPE-fix family as #14449 / #14476.)
            trap '' PIPE
            local out
            out="$(set +o pipefail; gcloud builds describe "$build_id" \
              --project=tsz-ci \
              --region=us-central1 \
              --format='value(status)' 2>/dev/null)" || out=""
            printf '%s\n' "$out"
          }
          capture_cloudbuild_log() {
            local build_id="$1"
            [[ -n "$build_id" ]] || return 0
            gcloud builds log "$build_id" \
              --project=tsz-ci \
              --region=us-central1 \
              > bench-prep-cloudbuild.log 2>&1 || true
          }
          cloudbuild_id="${{ needs.bench-prepare-cloudbuild.outputs.build_id }}"
          target_sha="${{ env.BENCH_TARGET_SHA }}"

          deadline=$((SECONDS + 9000))
          success_seen_at=""
          success_grace_seconds=7200
          while true; do
            if storage_cp \
              "gs://tsz-ci_cloudbuild/bench-prep/${target_sha}/bench-prep.env" \
              bench-prep.env && \
              storage_cp \
                "gs://tsz-ci_cloudbuild/bench-prep/${target_sha}/bench-prep.tar" \
                bench-prep.tar; then
              if validate_downloaded_prep_artifact; then
                exit 0
              fi
              echo "Cloud Build prep artifact is for ${manifest_target_sha:-unknown} / PGO=${manifest_pgo_optimized:-0}; waiting for ${target_sha}."
            fi

            status="$(cloudbuild_status "$cloudbuild_id")"
            if [[ "$status" == "SUCCESS" ]]; then
              if [[ -z "$success_seen_at" ]]; then
                success_seen_at="$SECONDS"
                echo "Cloud Build benchmark prep ${cloudbuild_id} succeeded; waiting up to ${success_grace_seconds}s for prep artifacts to become visible."
              fi
              if copy_from_latest_prep_artifact; then
                exit 0
              fi
              if copy_from_cloudbuild_manifest "${target_sha}"; then
                if validate_downloaded_prep_artifact; then
                  exit 0
                fi
                echo "Cloud Build benchmark prep ${cloudbuild_id} manifest artifact is for ${manifest_target_sha:-unknown} / PGO=${manifest_pgo_optimized:-0}; waiting for ${target_sha} / PGO=1."
              fi
              if (( SECONDS - success_seen_at >= success_grace_seconds )); then
                echo "Cloud Build benchmark prep ${cloudbuild_id} succeeded, but neither SHA-scoped, latest, nor manifest artifacts exposed valid bench-prep env/tar for ${target_sha} after ${success_grace_seconds}s."
                capture_cloudbuild_log "$cloudbuild_id"
                exit 1
              fi
            fi
            case "$status" in
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "Cloud Build benchmark prep ${cloudbuild_id} ended with status ${status}; artifact is unavailable."
                capture_cloudbuild_log "$cloudbuild_id"
                exit 1
                ;;
            esac

            if (( SECONDS >= deadline )); then
              echo "No finished Cloud Build benchmark prep artifact is available for ${{ env.BENCH_TARGET_SHA }} after 150 minutes."
              [[ -z "$status" ]] || echo "Last Cloud Build benchmark prep status: ${status} (${cloudbuild_id})."
              capture_cloudbuild_log "$cloudbuild_id"
              exit 1
            fi

            echo "Waiting for Cloud Build benchmark prep artifact (build=${cloudbuild_id:-none}, status=${status:-unknown}, target=${target_sha}, elapsed=${SECONDS}s)..."
            sleep 30
          done

      - name: Upload benchmark prep diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-prep-diagnostics
          path: |
            bench-prep-cloudbuild.log
            cloudbuild-artifacts.json
            cloudbuild-artifacts.env
            bench-prep.env
            latest-bench-prep.env
          retention-days: 7
          if-no-files-found: warn
          compression-level: 1

      - name: Validate benchmark prep artifact
        shell: bash
        run: |
          tar -tf bench-prep.tar .target-bench/dist/tsz >/dev/null
          tar -tf bench-prep.tar .target-bench/dist/.bench-pgo-optimized >/dev/null

      - name: Upload normalized benchmark prep artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-prep-ready
          path: |
            bench-prep.env
            bench-prep.tar
          retention-days: 1
          if-no-files-found: error
          compression-level: 1

  bench:
    name: bench-${{ matrix.label }}
    needs: bench-prep-artifact
    if: always() && needs.bench-prep-artifact.result == 'success'
    runs-on: [self-hosted, tsz-cloud-run]
    # Outermost ceiling of the decoupled budget (#13751): build (105m) <
    # wait-deadline (115m) < this GitHub job timeout (135m). The extra slack
    # over the wait deadline covers pre-wait overhead (checkout, prep-artifact
    # download, validate, and the 600s submit cap) so a near-budget shard can
    # download artifacts after SUCCESS instead of being killed mid-poll.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      # Cap concurrent Cloud Build submissions: 8 simultaneous CreateBuild
      # calls exceed the project's concurrent-build headroom when PR CI is
      # busy, and gcloud retries the throttled call silently until the job
      # timeout (#13306: three shards sat 120 minutes with the tarball
      # uploaded and no build ever created). Four at a time keeps every
      # submit under quota; queued shards start with a fresh per-job timeout.
      max-parallel: 4
      matrix:
        include:
          - label: compiler-files
            timeout: 135
            filter: 'conditionalTypeDiscriminatingLargeUnionRegularTypeFetchingSpeedReasonable\.ts|manyConstExports\.ts|binderBinaryExpressionStress\.ts|binderBinaryExpressionStressJs\.ts|enumLiteralsSubtypeReduction\.ts|binaryArithmeticControlFlowGraphNotTooLarge\.ts|privacyFunctionParameterDeclFile\.ts|privacyGloFunc\.ts|privacyTypeParameterOfFunctionDeclFile\.ts|typedArrays\.ts|controlFlowArrays\.ts'
          - label: synthetic
            timeout: 135
            filter: '[0-9]+ classes|[0-9]+ generic functions|DeepPartial optional-chain|Shallow optional-chain|[0-9]+ union members'
          - label: project-hotspots
            timeout: 135
            filter: 'Recursive utility aliases|Indexed access hotspot|Remapped accessor hotspot|Conditional infer hotspot|Object spread hotspot|Contextual callback hotspot'
          - label: solver-stress
            timeout: 135
            filter: 'Recursive generic depth|Conditional dist N|Mapped type keys|Template literal N|Deep subtype depth|Intersection N|Infer stress N|CFA branches'
          - label: algorithmic-bct
            timeout: 135
            filter: 'BCT candidates'
          - label: algorithmic-constraint
            timeout: 135
            filter: 'Constraint conflicts N'
          - label: algorithmic-mapped
            timeout: 135
            filter: 'Mapped complex template keys'
          - label: projects
            timeout: 135
            filter: 'utility-types/|ts-toolbelt/|ts-essentials/|utility-types-project|ts-toolbelt-project|ts-essentials-project|rxjs-project|type-fest-project|zod-project|kysely-project|comlink-project|vite-vanilla-ts-app|nextjs-fresh-app|nextjs'
          # Passing-canary perf rows. Isolated from the required `projects` shard
          # so timing the opt-in canary corpus (PERF_TIMED_CANARY_PROJECT_ROWS in
          # scripts/bench/project-rows.mjs) never spends the required shard's
          # budget or stalls the publish gate. These are external-library rows
          # with bench-vs-tsgo runners; the website only charts the ones that
          # check green.
          - label: bench-canaries
            timeout: 135
            filter: 'valibot-project|msw-project|effect-project|drizzle-orm-project|ts-rest-project|ofetch-project|ts-pattern-project|radash-project|valtio-project|scule-project|mitt-project|ts-belt-project|ts-extras-project|superjson-project|trpc-project|tanstack-query-project|tanstack-router-project|zustand-project|jotai-project|fp-ts-project|io-ts-project|immer-project|remeda-project|ts-morph-project|arktype-project|superstruct-project|runtypes-project|hotscript-project|typebox-project|class-transformer-project|type-graphql-project|neverthrow-project|xstate-project|mobx-project'
          # Application rows need their real dependency graph to produce a
          # meaningful tsz-vs-tsgo timing pair. Keep them in an optional shard:
          # clean rows get chart data when timing completes, but app install
          # flakiness never blocks required benchmark publishing.
          - label: bench-applications
            timeout: 135
            filter: 'umami-project|excalidraw-project|dub-project|formbricks-project|typebot-project|lobe-chat-project|supabase-studio-project|infisical-project|payload-project|medusa-project|outline-project|trigger-dev-project|joplin-project|directus-project|n8n-project|cal-com-project|documenso-project|affine-project|immich-server-project|rocketchat-project'
          - label: large-ts-repo
            timeout: 135
            filter: '^large-ts-repo$'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.BENCH_TARGET_SHA }}
          fetch-depth: 1

      - name: Download benchmark prep artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bench-prep-ready
          path: .

      - name: Validate source benchmark prep artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f bench-prep.env
          test -f bench-prep.tar
          grep -qx "BENCH_TARGET_SHA=${BENCH_TARGET_SHA}" bench-prep.env
          grep -qx "BENCH_PGO_OPTIMIZED=1" bench-prep.env
          tar -tf bench-prep.tar .target-bench/dist/tsz >/dev/null
          tar -tf bench-prep.tar .target-bench/dist/.bench-pgo-optimized >/dev/null

      - id: cloudbuild-submit
        name: Submit benchmark shard to Cloud Build pool
        shell: bash
        run: |
          set -euo pipefail

          # Even with --async, a quota-throttled CreateBuild is retried by
          # gcloud silently (#13306: tarball uploaded, no build created, two
          # hours of silence until the job timeout). Bound the submit so a
          # starved shard fails fast with an attributable message instead of
          # burning the whole job budget.
          submit_rc=0
          submit_output="$(timeout 600 gcloud builds submit \
            --async \
            --project=tsz-ci \
            --region=us-central1 \
            --config=scripts/cloudbuild/cloudbuild-bench-shard.yaml \
            --gcs-source-staging-dir=gs://tsz-ci_cloudbuild/cb-source-staging \
            --substitutions=_BENCH_TARGET_SHA="${BENCH_TARGET_SHA}",_BENCH_SHARD_LABEL="${{ matrix.label }}",_BENCH_SHARD_FILTER="${{ matrix.filter }}",_BENCH_IMAGE="${BENCH_IMAGE_REF:-rust:1.95}" \
            --format='value(id)' \
            .)" || submit_rc=$?
          if [[ "$submit_rc" -eq 124 ]]; then
            echo "::error::Cloud Build submit for ${{ matrix.label }} produced no build within 10 minutes — concurrent-build quota starvation (#13306), not a benchmark result. Re-run when the pool drains." >&2
            exit 1
          elif [[ "$submit_rc" -ne 0 ]]; then
            printf '%s\n' "$submit_output"
            echo "Cloud Build shard submit failed with exit ${submit_rc}." >&2
            exit "$submit_rc"
          fi
          build_id="$(grep -Eo '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' <<<"$submit_output" | tail -n 1 || true)"
          if [[ -z "$build_id" ]]; then
            printf '%s\n' "$submit_output"
            echo "Cloud Build shard submit did not return a build id." >&2
            exit 1
          fi
          echo "Submitted Cloud Build benchmark shard ${build_id} for ${{ matrix.label }}."
          echo "build_id=${build_id}" >> "$GITHUB_OUTPUT"

      - name: Wait for Cloud Build shard artifacts
        shell: bash
        run: |
          set -euo pipefail

          storage_cp() {
            timeout 45s gcloud storage cp "$1" "$2" >/dev/null 2>&1
          }
          cloudbuild_status() {
            # gcloud can take a transient SIGPIPE from its internal pipes during
            # Cloud Build polling; under pipefail that escapes as a fatal step
            # exit 141 that kills the shard wait before the signed shard JSON is
            # downloaded, leaving an unsigned stale JSON that merge-results
            # rejects (so bench-publish fails). Ignore SIGPIPE and capture with
            # pipefail off so a poll hiccup yields an empty status (caller
            # retries). (Same SIGPIPE-fix family as #14449 / #14476.)
            trap '' PIPE
            local out
            out="$(set +o pipefail; gcloud builds describe "${{ steps.cloudbuild-submit.outputs.build_id }}" \
              --project=tsz-ci \
              --region=us-central1 \
              --format='value(status)' 2>/dev/null)" || out=""
            printf '%s\n' "$out"
          }
          capture_cloudbuild_log() {
            gcloud builds log "${{ steps.cloudbuild-submit.outputs.build_id }}" \
              --project=tsz-ci \
              --region=us-central1 \
              > "bench-cloudbuild-${{ matrix.label }}.log" 2>&1 || true
          }
          copy_from_cloudbuild_manifest() {
            local manifest_file=cloudbuild-artifacts.json
            local manifest_paths=cloudbuild-artifacts.env

            storage_cp \
              "gs://tsz-ci_cloudbuild/artifacts-${{ steps.cloudbuild-submit.outputs.build_id }}.json" \
              "$manifest_file" || return 1
            if ! node - "$manifest_file" "${{ matrix.label }}" > "$manifest_paths" <<'NODE'
          const fs = require("node:fs");

          const [manifestPath, label] = process.argv.slice(2);
          const rawManifest = fs.readFileSync(manifestPath, "utf8").trim();
          const parseManifest = (raw) => {
            if (!raw) return [];
            try {
              return JSON.parse(raw);
            } catch (jsonError) {
              return raw.split(/\r?\n/)
                .map((line) => line.trim())
                .filter(Boolean)
                .map((line, index) => {
                  try {
                    return JSON.parse(line);
                  } catch (lineError) {
                    lineError.message = `Could not parse Cloud Build artifact manifest line ${index + 1}: ${lineError.message}`;
                    throw lineError;
                  }
                });
            }
          };
          const collectEntries = (manifest) => {
            const queue = Array.isArray(manifest) ? [...manifest] : [manifest];
            const entries = [];
            for (const entry of queue) {
              if (!entry || typeof entry !== "object") continue;
              if (entry.location) entries.push(entry);
              for (const key of ["artifacts", "results", "objects", "files"]) {
                if (Array.isArray(entry[key])) queue.push(...entry[key]);
              }
            }
            return entries;
          };
          const entries = collectEntries(parseManifest(rawManifest));
          const locationOf = (entry) => String(entry.location || "").split("#", 1)[0];
          const findLocation = (basename) => {
            for (const entry of entries) {
              const location = locationOf(entry);
              if (location.endsWith(`/${basename}`) || location.endsWith(basename)) {
                return location;
              }
            }
            return "";
          };
          const files = {
            status: `bench-status-${label}.env`,
            results: `bench-results-${label}.json`,
            run: `bench-run-${label}.log`,
            postmortem: `bench-postmortem-${label}.log`,
            prep_fetch: `bench-prep-fetch-${label}.log`,
          };
          const locations = Object.fromEntries(
            Object.entries(files).map(([key, basename]) => [key, findLocation(basename)]),
          );
          if (!locations.status) {
            console.error(`Cloud Build artifact manifest did not include bench status for ${label}.`);
            process.exit(1);
          }
          for (const [key, location] of Object.entries(locations)) {
            if (location) {
              console.log(`manifest_${key}=${JSON.stringify(location)}`);
            }
          }
          NODE
            then
              return 1
            fi
            # shellcheck disable=SC1090
            source "$manifest_paths"
            [[ -n "${manifest_status:-}" ]] || return 1
            storage_cp "$manifest_status" "bench-status-${{ matrix.label }}.env" || return 1
            [[ -z "${manifest_results:-}" ]] || storage_cp "$manifest_results" "bench-results-${{ matrix.label }}.json" || true
            [[ -z "${manifest_run:-}" ]] || storage_cp "$manifest_run" "bench-run-${{ matrix.label }}.log" || true
            [[ -z "${manifest_postmortem:-}" ]] || storage_cp "$manifest_postmortem" "bench-postmortem-${{ matrix.label }}.log" || true
            [[ -z "${manifest_prep_fetch:-}" ]] || storage_cp "$manifest_prep_fetch" "bench-prep-fetch-${{ matrix.label }}.log" || true
          }
          download_shard_artifacts() {
            local prefix="gs://tsz-ci_cloudbuild/bench-shards/${BENCH_TARGET_SHA}/${{ matrix.label }}"
            if storage_cp "${prefix}/bench-status-${{ matrix.label }}.env" "bench-status-${{ matrix.label }}.env"; then
              storage_cp "${prefix}/bench-results-${{ matrix.label }}.json" "bench-results-${{ matrix.label }}.json" || true
              storage_cp "${prefix}/bench-run-${{ matrix.label }}.log" "bench-run-${{ matrix.label }}.log" || true
              storage_cp "${prefix}/bench-postmortem-${{ matrix.label }}.log" "bench-postmortem-${{ matrix.label }}.log" || true
              storage_cp "${prefix}/bench-prep-fetch-${{ matrix.label }}.log" "bench-prep-fetch-${{ matrix.label }}.log" || true
              return 0
            fi
            copy_from_cloudbuild_manifest
          }
          shard_status_value() {
            local key="$1"
            awk -v key="$key" '
              index($0, key "=") == 1 { value = substr($0, length(key) + 2) }
              END { print value }
            ' "bench-status-${{ matrix.label }}.env"
          }
          shard_published_complete_results() {
            local results_file="bench-results-${{ matrix.label }}.json"
            local run_log="bench-run-${{ matrix.label }}.log"
            [[ -s "$results_file" ]] || return 1
            [[ -s "$run_log" ]] || return 1
            grep -q "Results Summary" "$run_log" || return 1
            grep -q "JSON results written:" "$run_log" || return 1
            node - "$results_file" <<'NODE'
          const fs = require("node:fs");

          const file = process.argv[2];
          const data = JSON.parse(fs.readFileSync(file, "utf8"));
          const results = Array.isArray(data.results) ? data.results : [];
          if (data.error) process.exit(1);
          if (results.length === 0) process.exit(1);
          if (data.totals && Number(data.totals.rows) !== results.length) process.exit(1);
          process.exit(0);
          NODE
          }

          # Decoupled timeout budget (#13751): build-timeout < wait-deadline <
          # github-job-timeout. The Cloud Build shard self-terminates at 6300s
          # (105m, cloudbuild-bench-shard.yaml), so this wait deadline must be
          # strictly *longer* than that — otherwise the poll loop would give up
          # before a near-budget-but-successful build reaches SUCCESS, killing it
          # mid-poll before artifacts download (the false-negative this fixes).
          # SECONDS counts from this wait step's start (after checkout/download/
          # submit, ~10m into the job), so a 6900s (115m) wait window ends well
          # inside the 135m GitHub job timeout (timeout-minutes above) while
          # still outlasting the 105m Cloud Build ceiling.
          wait_deadline_seconds=6900
          deadline=$((SECONDS + wait_deadline_seconds))
          while true; do
            status="$(cloudbuild_status)"
            if [[ "$status" == "SUCCESS" ]]; then
              if ! download_shard_artifacts; then
                echo "Cloud Build shard succeeded but did not publish a status artifact for ${{ matrix.label }}."
                capture_cloudbuild_log
                exit 1
              fi
              status_target_sha="$(shard_status_value BENCH_TARGET_SHA)"
              status_shard_label="$(shard_status_value BENCH_SHARD_LABEL)"
              status_exit="$(shard_status_value BENCH_SHARD_STATUS)"
              if [[ "${status_target_sha}" != "${{ env.BENCH_TARGET_SHA }}" ||
                    "${status_shard_label}" != "${{ matrix.label }}" ]]; then
                echo "Cloud Build shard status metadata did not match this shard."
                cat "bench-status-${{ matrix.label }}.env"
                exit 1
              fi
              if ! [[ "${status_exit}" =~ ^[0-9]+$ ]]; then
                echo "Cloud Build shard status did not include numeric BENCH_SHARD_STATUS."
                cat "bench-status-${{ matrix.label }}.env"
                exit 1
              fi
              if [[ "${status_exit}" != "0" ]] && shard_published_complete_results; then
                echo "Cloud Build shard reported BENCH_SHARD_STATUS=${status_exit}, but it published complete benchmark results for ${{ matrix.label }}; allowing publish to merge the artifact."
                exit 0
              fi
              exit "${status_exit}"
            fi
            case "$status" in
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "Cloud Build benchmark shard ${{ steps.cloudbuild-submit.outputs.build_id }} ended with status ${status}."
                download_shard_artifacts || true
                capture_cloudbuild_log
                exit 1
                ;;
            esac

            if (( SECONDS >= deadline )); then
              # Note: the wait window is wait_deadline_seconds (115m), which is
              # decoupled from and shorter than matrix.timeout (the 135m GitHub
              # job timeout) per #13751. The message reuses matrix.timeout as a
              # stable label; the effective wait deadline is 115 minutes.
              echo "No finished Cloud Build benchmark shard artifact is available for ${{ matrix.label }} after ${{ matrix.timeout }} minutes."
              [[ -z "$status" ]] || echo "Last Cloud Build benchmark shard status: ${status} (${{ steps.cloudbuild-submit.outputs.build_id }})."
              capture_cloudbuild_log
              exit 1
            fi

            echo "Waiting for Cloud Build benchmark shard ${{ matrix.label }}..."
            sleep 30
          done

      - name: Upload benchmark shard artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results-${{ matrix.label }}
          path: |
            bench-results-${{ matrix.label }}.json
            bench-status-${{ matrix.label }}.env
            bench-run-${{ matrix.label }}.log
            bench-postmortem-${{ matrix.label }}.log
            bench-prep-fetch-${{ matrix.label }}.log
            bench-cloudbuild-${{ matrix.label }}.log
          retention-days: 7
          if-no-files-found: warn
          compression-level: 1

  pgo-compile-canaries:
    name: bench-pgo-compile-canaries
    needs: bench-prep-artifact
    if: always() && needs.bench-prep-artifact.result == 'success'
    runs-on: [self-hosted, tsz-cloud-run]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.BENCH_TARGET_SHA }}
          fetch-depth: 1

      - name: Download benchmark prep artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bench-prep-ready
          path: .

      - name: Run PGO compile canaries
        shell: bash
        run: |
          set -euo pipefail

          tar -xf bench-prep.tar
          test -x .target-bench/dist/tsz
          test -f .target-bench/dist/.bench-pgo-optimized

          # Skip category:"application" canary rows here: they clone+install real
          # apps (minutes each) and are excluded from the benchmark corpus, so
          # they produce no PGO timing data. Application compatibility is still
          # tracked by the CI project-compile-canary shards, which do not set
          # this flag.
          TSZ_BIN="$GITHUB_WORKSPACE/.target-bench/dist/tsz" \
          TSZ_PROJECT_COMPILE_SET=canary \
          TSZ_PROJECT_COMPILE_SKIP_APPLICATIONS=1 \
          TSZ_PROJECT_COMPILE_ALLOW_FAILURES=1 \
          scripts/ci/project-compile-guard.sh

      - name: Stage PGO compile compatibility artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bench-pgo-compile-compatibility
          cp .target/project-compile-guard/project-compatibility.jsonl \
            bench-pgo-compile-compatibility/
          cp .target/project-compile-guard/project-compatibility-summary.json \
            bench-pgo-compile-compatibility/

      - name: Upload PGO compile compatibility artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-pgo-compile-compatibility
          path: bench-pgo-compile-compatibility
          retention-days: 7
          if-no-files-found: error
          compression-level: 1

  publish:
    name: bench-publish
    needs: [bench, pgo-compile-canaries]
    if: >-
      always() &&
      (needs.bench.result == 'success' || needs.bench.result == 'failure' || needs.bench.result == 'cancelled') &&
      needs.pgo-compile-canaries.result == 'success'
    runs-on: [self-hosted, tsz-cloud-run]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.BENCH_TARGET_SHA }}
          fetch-depth: 1

      - name: Download benchmark shard artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bench-results-*
          path: bench-artifacts
          merge-multiple: true

      - name: Download benchmark prep artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bench-prep-ready
          path: .

      - name: Download PGO compile compatibility artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bench-pgo-compile-compatibility
          path: bench-pgo-compile-compatibility

      - name: Restore PGO compile compatibility artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .target/project-compile-guard
          cp bench-pgo-compile-compatibility/project-compatibility.jsonl \
            .target/project-compile-guard/
          cp bench-pgo-compile-compatibility/project-compatibility-summary.json \
            .target/project-compile-guard/

      # The category:"application" canary rows (umami, excalidraw, ...) are
      # compiled with full compat by main CI's project-compile-canary matrix
      # (no skip flag), but the PGO compat step above runs with
      # TSZ_PROJECT_COMPILE_SKIP_APPLICATIONS=1 (to fit its budget) so it emits
      # no compat line for them. Without an application compat row the site's
      # compatibilityState() renders them gray ("missing or incomplete
      # artifact"). Reuse the already-computed compat from the matching CI run
      # so application rows show real status/files/peak.
      #
      # Best-effort by design: a missing exact-SHA CI artifact must never publish
      # mismatched compatibility. The readiness gate below refuses the artifact
      # instead of updating the public site with gray application rows.
      - id: app-compat-source
        name: Resolve application compile compatibility CI run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          run_id=""
          source_label=""
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            run_id="${{ github.event.workflow_run.id }}"
            source_label="triggering workflow_run CI"
          else
            target_sha="${BENCH_TARGET_SHA:-${GITHUB_SHA}}"
            while IFS=$'\t' read -r candidate_id candidate_sha candidate_url; do
              [[ -n "${candidate_id:-}" ]] || continue
              if [[ "${candidate_sha}" == "${target_sha}" ]]; then
                run_id="${candidate_id}"
                source_label="successful main CI for ${target_sha}"
                echo "Resolved application compatibility CI run: ${candidate_url}"
                break
              fi
            done < <(
              node -e '
                const https = require("node:https");
                const repo = process.env.GITHUB_REPOSITORY;
                const token = process.env.GITHUB_TOKEN;
                if (!repo) {
                  console.error("GITHUB_REPOSITORY is required to resolve CI runs");
                  process.exit(1);
                }
                const requestPath = `/repos/${repo}/actions/runs?branch=main&event=push&status=success&per_page=50`;
                const request = https.request({
                  hostname: "api.github.com",
                  path: requestPath,
                  method: "GET",
                  headers: {
                    "Accept": "application/vnd.github+json",
                    "User-Agent": "tsz-bench-publish",
                    "X-GitHub-Api-Version": "2022-11-28",
                    ...(token ? { "Authorization": `Bearer ${token}` } : {}),
                  },
                }, (response) => {
                  let body = "";
                  response.setEncoding("utf8");
                  response.on("data", (chunk) => body += chunk);
                  response.on("end", () => {
                    if (response.statusCode < 200 || response.statusCode >= 300) {
                      console.error(`GitHub Actions runs API returned ${response.statusCode}: ${body}`);
                      process.exit(1);
                    }
                    const payload = JSON.parse(body);
                    for (const run of payload.workflow_runs || []) {
                      if (run.name !== "CI") continue;
                      console.log([run.id, run.head_sha, run.html_url].join("\t"));
                    }
                  });
                });
                request.on("error", (error) => {
                  console.error(error.message);
                  process.exit(1);
                });
                request.end();
              '
            )

            if [[ -z "${run_id}" ]]; then
              echo "::warning::no successful main CI run found for ${target_sha}; application rows will render gray unless a later run publishes exact compatibility"
            fi
          fi

          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "source_label=${source_label}" >> "$GITHUB_OUTPUT"

      - name: Download required compile compatibility from matching CI (best-effort)
        if: steps.app-compat-source.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: project-compile-compatibility
          path: .target/app-compile-required-compat
          run-id: ${{ steps.app-compat-source.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download canary compile compatibility from matching CI (best-effort)
        if: steps.app-compat-source.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: project-compile-canary-logs
          path: .target/app-compile-canary-compat
          run-id: ${{ steps.app-compat-source.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: List application compile compatibility
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ steps.app-compat-source.outputs.source_label }}" ]]; then
            echo "Application compatibility source: ${{ steps.app-compat-source.outputs.source_label }}"
          fi
          if ! find .target/app-compile-required-compat .target/app-compile-canary-compat \
            -name 'project-compatibility.jsonl' -type f -size +0c 2>/dev/null | grep -q .; then
            echo "::warning::no matching-CI project compatibility JSONL downloaded; application rows will render gray this run"
          fi
          find .target/app-compile-required-compat .target/app-compile-canary-compat \
            -type f -print 2>/dev/null || true

      - id: merge
        name: Merge benchmark results
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t json_files < <(find bench-artifacts -name 'bench-results-*.json' -type f | sort)
          # Optional perf shards are merged when present but must NOT count
          # toward — or break — the required-shard completeness gate. A
          # failed/slow canary or application shard then never blocks publishing
          # the required benchmark timings.
          mapfile -t required_files < <(
            printf '%s\n' "${json_files[@]}" | grep -Ev '/bench-results-bench-(canaries|applications)\.json$' || true
          )
          expected_shards=9
          # A required shard that exits non-zero writes only an error stub
          # ({"results":[],"error":...}) per cloudbuild-bench-shard.yaml, which
          # merge-results.mjs drops from the published artifact. Count required
          # shards that actually produced result rows — not merely the stub
          # files present — so a failed required shard yields complete=false
          # instead of publishing silently-incomplete data marked complete.
          required_present=0
          for shard_json in "${required_files[@]}"; do
            if node -e 'const fs=require("fs");try{const r=JSON.parse(fs.readFileSync(process.argv[1],"utf8")).results;process.exit(Array.isArray(r)&&r.length>0?0:1)}catch{process.exit(1)}' "${shard_json}"; then
              required_present=$((required_present + 1))
            else
              echo "::warning::Required benchmark shard $(basename "${shard_json}") produced no result rows (failed/partial shard); excluding it from the required-shard completeness count."
            fi
          done
          echo "json_count=${required_present}" >> "$GITHUB_OUTPUT"
          echo "expected_json_count=${expected_shards}" >> "$GITHUB_OUTPUT"
          if [[ "${required_present}" -eq 0 ]]; then
            echo "No required benchmark shard produced result rows."
            find bench-artifacts -maxdepth 2 -type f -print || true
            exit 1
          fi
          if [[ "${required_present}" -ne "${expected_shards}" ]]; then
            echo "::warning::Expected ${expected_shards} required benchmark shards with results, found ${required_present}; merging partial artifact for diagnosis, but public publish will fail."
            printf 'Found JSON files:\n'
            printf '  %s\n' "${json_files[@]}"
            find bench-artifacts -maxdepth 2 -type f -print || true
            echo "complete=false" >> "$GITHUB_OUTPUT"
          else
            echo "complete=true" >> "$GITHUB_OUTPUT"
          fi
          compat_args=( --compat-jsonl "$GITHUB_WORKSPACE/.target/project-compile-guard/project-compatibility.jsonl" )
          # Add the application-row compat from the matching CI run if present
          # (mergeCompatibilityCanaries is idempotent: re-attaching the same
          # canary compat is harmless and required rows are never overwritten).
          mapfile -t triggering_compat_files < <(
            find \
              "$GITHUB_WORKSPACE/.target/app-compile-required-compat" \
              "$GITHUB_WORKSPACE/.target/app-compile-canary-compat" \
              -name 'project-compatibility.jsonl' -type f -size +0c 2>/dev/null | sort
          )
          if [[ "${#triggering_compat_files[@]}" -gt 0 ]]; then
            for app_compat in "${triggering_compat_files[@]}"; do
              echo "Including application compile compatibility from matching CI run: $app_compat"
              compat_args+=( --compat-jsonl "$app_compat" )
            done
          else
            echo "::warning::no application compile compatibility found; application rows will render gray this run"
          fi
          node scripts/bench/merge-results.mjs \
            "$GITHUB_WORKSPACE/bench-results.json" \
            --require-runner-signature \
            "${compat_args[@]}" \
            "${json_files[@]}"

      - name: Summarize green tsgo winners
        shell: bash
        run: |
          set -euo pipefail
          node scripts/bench/tsgo-winner-report.mjs \
            "$GITHUB_WORKSPACE/bench-results.json" \
            "$GITHUB_WORKSPACE/bench-results-tsgo-winners.json" \
            "$GITHUB_WORKSPACE/bench-results-missing-attribution.md"

      - name: Collect target-gap attribution artifacts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/bench/run-attribution-plan.mjs \
            "$GITHUB_WORKSPACE/bench-results-tsgo-winners.json" \
            "$GITHUB_WORKSPACE/bench-results" \
            "$GITHUB_WORKSPACE/bench-results-attribution-manifest.json"
          node scripts/bench/tsgo-winner-report.mjs \
            "$GITHUB_WORKSPACE/bench-results.json" \
            "$GITHUB_WORKSPACE/bench-results-tsgo-winners.json" \
            "$GITHUB_WORKSPACE/bench-results-missing-attribution.md"

      - name: Compare project winner regressions
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          previous="$GITHUB_WORKSPACE/bench-results-previous-latest.json"
          report_json="$GITHUB_WORKSPACE/bench-results-project-winner-regressions.json"
          report_md="$GITHUB_WORKSPACE/bench-results-project-winner-regressions.md"

          if ! gsutil -q cp "${_TSZ_CI_CACHE_BUCKET}/bench-runs/latest.json" "$previous"; then
            echo "No previous latest benchmark artifact available; skipping project winner regression comparison." | tee "$report_md"
            echo '{"schema_version":1,"skipped":true,"reason":"previous latest benchmark artifact unavailable"}' > "$report_json"
            exit 0
          fi

          set +e
          node scripts/bench/project-winner-regression-report.mjs \
            "$previous" \
            "$GITHUB_WORKSPACE/bench-results.json" \
            "$report_json" | tee "$report_md"
          status="${PIPESTATUS[0]}"
          set -e

          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            cat "$report_md" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - id: readiness
        name: Check public benchmark project timings
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node scripts/bench/check-artifact-readiness.mjs \
            --json \
            --require-application-compat \
            --require-green-project-timing-pairs \
            --require-project-timing-pairs=1 \
            "$GITHUB_WORKSPACE/bench-results.json" \
            > "$GITHUB_WORKSPACE/bench-results-readiness.json"

      - name: Upload merged benchmark artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results-merged
          path: |
            bench-results.json
            bench-results-tsgo-winners.json
            bench-results-missing-attribution.md
            bench-results-attribution-manifest.json
            bench-results*.perf.json
            bench-results-project-winner-regressions.json
            bench-results-project-winner-regressions.md
            bench-results-readiness.json
          retention-days: 30
          if-no-files-found: error
          compression-level: 1

      - name: Fail non-published partial benchmark artifact
        if: steps.merge.outputs.complete != 'true' || steps.readiness.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.merge.outputs.complete }}" != "true" ]]; then
            echo "Merged ${{ steps.merge.outputs.json_count }}/${{ steps.merge.outputs.expected_json_count }} benchmark shard JSON files into bench-results-merged for diagnosis, but refusing to publish it as latest."
          fi
          if [[ "${{ steps.readiness.outcome }}" != "success" ]]; then
            echo "Benchmark artifact readiness check did not pass; refusing to publish it as latest."
            echo "This includes application compatibility rows, so the website will not publish an all-gray application group."
          fi
          exit 1

      - name: Publish results
        if: steps.merge.outputs.complete == 'true' && steps.readiness.outcome == 'success'
        id: publish
        run: |
          set -euo pipefail

          TIMESTAMP="$(date +%Y%m%d-%H%M%S)"
          # Informational only (the "behind main" log below); never let a transient
          # git ls-remote failure abort the publish that already produced results.
          MAIN_SHA="$(git ls-remote origin refs/heads/main 2>/dev/null | awk '{print $1}' || true)"
          TARGET_SHA="${BENCH_TARGET_SHA:-${GITHUB_SHA}}"

          gsutil -q cp "$GITHUB_WORKSPACE/bench-results.json" \
            "${_TSZ_CI_CACHE_BUCKET}/bench-runs/${TIMESTAMP}.json"
          echo "Published: ${_TSZ_CI_CACHE_BUCKET}/bench-runs/${TIMESTAMP}.json"
          gsutil -q cp "$GITHUB_WORKSPACE/bench-results-tsgo-winners.json" \
            "${_TSZ_CI_CACHE_BUCKET}/bench-runs/${TIMESTAMP}.tsgo-winners.json"
          echo "Published: ${_TSZ_CI_CACHE_BUCKET}/bench-runs/${TIMESTAMP}.tsgo-winners.json"
          gsutil -q cp "$GITHUB_WORKSPACE/bench-results-missing-attribution.md" \
            "${_TSZ_CI_CACHE_BUCKET}/bench-runs/${TIMESTAMP}.missing-attribution.md"
          echo "Published: ${_TSZ_CI_CACHE_BUCKET}/bench-runs/${TIMESTAMP}.missing-attribution.md"

          if [[ -n "${MAIN_SHA}" && "${TARGET_SHA}" != "${MAIN_SHA}" ]]; then
            echo "Bench target ${TARGET_SHA} is behind current main ${MAIN_SHA}; publishing because active benchmark runs are intentionally allowed to finish."
          fi

          # Monotonic latest.json guard. Incident: an older/slower bench finishing
          # late must not clobber a newer latest.json (the root cause behind the
          # website-side newest-wins selector). Refuse to overwrite latest.* when the
          # already-published latest.json carries a newer-or-equal generated_at than
          # this run's results. The timestamped ${TIMESTAMP}.json above is always kept
          # for history regardless. Only refuses when BOTH timestamps parse and this
          # run is not strictly newer, so it can never reduce publishing on first
          # publish or on missing/unparseable metadata.
          existing_latest="$GITHUB_WORKSPACE/bench-results-existing-latest.json"
          if ! gsutil -q cp "${_TSZ_CI_CACHE_BUCKET}/bench-runs/latest.json" "$existing_latest" 2>/dev/null; then
            rm -f "$existing_latest"
          fi
          latest_decision="$(node -e '
            const fs = require("node:fs");
            const gen = (p) => { try { return Date.parse(JSON.parse(fs.readFileSync(p, "utf8")).generated_at) || 0; } catch { return 0; } };
            const incoming = gen(process.argv[1]);
            const existing = gen(process.argv[2]);
            process.stdout.write(incoming > 0 && existing > 0 && incoming <= existing ? "skip" : "publish");
          ' "$GITHUB_WORKSPACE/bench-results.json" "$existing_latest")"
          rm -f "$existing_latest"

          if [[ "$latest_decision" == "skip" ]]; then
            echo "latest.json guard: existing latest.json is newer-or-equal than this run; keeping it and skipping the latest.* overwrite (timestamped ${TIMESTAMP}.json was still published)."
            echo "should_redeploy=false" >> "$GITHUB_OUTPUT"
          else
            gsutil -q cp "$GITHUB_WORKSPACE/bench-results.json" \
              "${_TSZ_CI_CACHE_BUCKET}/bench-runs/latest.json"
            echo "Published: ${_TSZ_CI_CACHE_BUCKET}/bench-runs/latest.json"
            gsutil -q cp "$GITHUB_WORKSPACE/bench-results-tsgo-winners.json" \
              "${_TSZ_CI_CACHE_BUCKET}/bench-runs/latest.tsgo-winners.json"
            echo "Published: ${_TSZ_CI_CACHE_BUCKET}/bench-runs/latest.tsgo-winners.json"
            gsutil -q cp "$GITHUB_WORKSPACE/bench-results-missing-attribution.md" \
              "${_TSZ_CI_CACHE_BUCKET}/bench-runs/latest.missing-attribution.md"
            echo "Published: ${_TSZ_CI_CACHE_BUCKET}/bench-runs/latest.missing-attribution.md"
            echo "should_redeploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report severe benchmark gaps
        if: steps.publish.outputs.should_redeploy == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.BENCH_ALERT_TOKEN || github.token }}
          BENCH_ALERT_TSZ_SLOWER_FACTOR: "5"
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const https = require("node:https");

          (async () => {
            const token = process.env.GH_TOKEN;
            const repo = process.env.GITHUB_REPOSITORY;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const threshold = Number(process.env.BENCH_ALERT_TSZ_SLOWER_FACTOR || 5);
            const data = JSON.parse(fs.readFileSync("bench-results.json", "utf8"));
            const winnerReport = JSON.parse(fs.readFileSync("bench-results-tsgo-winners.json", "utf8"));
            const rows = (winnerReport.rows || [])
              .filter((row) => Number(row.factor) >= threshold)
              .sort((a, b) => Number(b.factor || 0) - Number(a.factor || 0));

            if (!rows.length) {
              console.log(`No green tsgo wins at or above ${threshold}x.`);
              return;
            }

            if (!token) {
              console.log("No GitHub token available; skipping benchmark alert issue.");
              return;
            }

            function github(method, path, body) {
              const payload = body === undefined ? undefined : JSON.stringify(body);
              const options = {
                hostname: "api.github.com",
                path,
                method,
                headers: {
                  "Accept": "application/vnd.github+json",
                  "Authorization": `Bearer ${token}`,
                  "User-Agent": "tsz-bench-alert",
                  "X-GitHub-Api-Version": "2022-11-28",
                },
              };
              if (payload !== undefined) {
                options.headers["Content-Type"] = "application/json";
                options.headers["Content-Length"] = Buffer.byteLength(payload);
              }
              return new Promise((resolve, reject) => {
                const req = https.request(options, (res) => {
                  let raw = "";
                  res.setEncoding("utf8");
                  res.on("data", (chunk) => raw += chunk);
                  res.on("end", () => {
                    const parsed = raw ? JSON.parse(raw) : null;
                    if (res.statusCode < 200 || res.statusCode >= 300) {
                      reject(new Error(`${method} ${path} failed with ${res.statusCode}: ${raw}`));
                      return;
                    }
                    resolve(parsed);
                  });
                });
                req.on("error", reject);
                if (payload !== undefined) req.write(payload);
                req.end();
              });
            }

            const title = "benchmark alert: severe tsgo wins on main";
            const table = rows.slice(0, 12).map((row) => {
              const tsz = Number(row.tsz_ms || 0).toFixed(2);
              const tsgo = Number(row.tsgo_ms || 0).toFixed(2);
              const factor = Number(row.factor || 0).toFixed(2);
              const owner = row.semantic_owner_family || "n/a";
              return `| \`${row.name}\` | ${factor}x | ${tsz} | ${tsgo} | ${row.lines || 0} | ${owner} |`;
            }).join("\n");
            const body = [
              `A completed main benchmark found ${rows.length} green row(s) where \`tsgo\` is at least ${threshold}x faster than \`tsz\`.`,
              "",
              `Run: ${runUrl}`,
              `Target SHA: \`${process.env.BENCH_TARGET_SHA || process.env.GITHUB_SHA}\``,
              `Generated at: \`${winnerReport.generated_at || data.generated_at || "unknown"}\``,
              "",
              "| Row | tsgo factor | tsz ms | tsgo ms | lines | owner family |",
              "|---|---:|---:|---:|---:|---|",
              table,
              "",
              "Provenance: cloud / bot / github-actions-bench-alert",
            ].join("\n");

            const query = encodeURIComponent(`repo:${repo} is:issue is:open in:title "${title}"`);
            const search = await github("GET", `/search/issues?q=${query}`);
            const existing = (search.items || []).find((issue) => issue.title === title);
            if (existing) {
              await github("POST", `/repos/${repo}/issues/${existing.number}/comments`, { body });
              console.log(`Commented on existing benchmark alert issue #${existing.number}.`);
            } else {
              const issue = await github("POST", `/repos/${repo}/issues`, {
                title,
                body,
                labels: ["urgent", "bench", "performance"],
              });
              console.log(`Created benchmark alert issue #${issue.number}.`);
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Trigger website redeploy
        if: steps.publish.outputs.should_redeploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The gh-pages redeploy dispatch is idempotent, so retry aggressively to
          # ride out transient API errors. Results are already published to GCS by
          # the preceding step; if the redeploy ultimately fails, warn but do NOT
          # fail bench-publish (a job failure here would flip needs.publish.result
          # and trigger a wasteful catch-up bench). The next publish redeploys.
          if ! curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 15 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/gh-pages.yml/dispatches" \
            -d '{"ref":"main"}'; then
            echo "::warning::Website redeploy dispatch failed after retries; benchmark data is published to GCS and will redeploy on the next publish."
          fi
