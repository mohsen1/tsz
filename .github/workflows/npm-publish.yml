name: npm publication unavailable during rewrite

# npm packages must not expose the incomplete R0 compiler as a product. Keep
# tag/manual invocations visible and explicitly blocked rather than failing on
# deleted WASM paths or silently publishing stale artifacts.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag requested for npm publication (publishing is currently blocked)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  unavailable:
    name: npm publication is intentionally unavailable
    runs-on: ubuntu-latest
    steps:
      - name: Explain the rewrite publication gate
        shell: bash
        run: |
          echo "::error title=TSZ npm publication unavailable::R0 has private native package assembly for process-contract validation only. npm publication remains disabled, and WASM does not return until R4."
          exit 1
