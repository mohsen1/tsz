name: CI Health Check

on:
  schedule:
    # Every 15 minutes on GitHub-hosted runners.
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Serialize overlapping firings (a slow */15 run must not race the next one over
# the single main-red sentinel issue). Do NOT cancel-in-progress: a useful
# health check should run to completion rather than be dropped. See issue #13744.
concurrency:
  group: ci-health
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  # main-red-sentinel files/updates/closes a single tracking issue when main's
  # post-merge CI breaches the conformance/parity floor.
  issues: write
  pull-requests: read

env:
  _BENCH_ARTIFACT_NAME: bench-results-merged

jobs:
  wip-state-comments:
    name: wip-state-comments
    runs-on: ubuntu-latest
    # Pure advisory probes (WIP-state + stale-run gaps). A transient gh API
    # error must not red the health workflow — matches bench-artifact-readiness.
    # The scripts already retry transient transport; this is belt-and-suspenders.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Report WIP-state comment gaps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node scripts/ci/check-wip-state-comments.mjs --advisory --window-hours 24 --max-prs 60 \
            | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Report stale queued/running CI runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node scripts/ci/check-stale-ci-runs.mjs --advisory --stale-minutes 45 --max-runs 100 \
            | tee -a "${GITHUB_STEP_SUMMARY}"

  main-red-sentinel:
    name: main-red-sentinel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Detect and track red main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Advisory by design: a monitoring job must not fail the health
          # workflow. --file-issue opens/updates/closes one deduplicated
          # tracking issue keyed on a hidden marker in the issue body.
          node scripts/ci/check-main-red.mjs --file-issue --max-runs 60 \
            | tee -a "${GITHUB_STEP_SUMMARY}"

  ci-job-timing:
    name: ci-job-timing
    runs-on: ubuntu-latest
    # Pure advisory baseline — a transient gh API error must not red the health
    # workflow (matches bench-artifact-readiness). The script also retries
    # transient transport; this is belt-and-suspenders.
    continue-on-error: true
    # Advisory baseline: records per-job queue_wait + run seconds over recent
    # successful ci.yml runs so every other CI speed claim on this fleet can be
    # checked against measured numbers (issue #13605 item 2). No wall-clock
    # change; the runner-acquisition (queue_wait) column surfaces pool pressure.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # Pull the per-run timing JSON documents this job persisted on previous
      # firings so the compare step has a trailing baseline. Each prior run's
      # artifact is named `ci-timing`; older runs that predate this artifact are
      # simply absent (continue-on-error), which the script treats as "no
      # baseline yet".
      - name: Download prior timing baselines
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          mkdir -p timing-baseline
          # Most recent completed ci-health runs (this workflow), newest first.
          run_ids="$(
            gh run list --repo "${REPOSITORY}" --workflow ci-health.yml \
              --status completed --limit 12 --json databaseId \
              --jq '.[].databaseId' 2>/dev/null || true
          )"
          for rid in ${run_ids}; do
            gh run download "${rid}" --repo "${REPOSITORY}" \
              --name ci-timing --dir "timing-baseline/${rid}" 2>/dev/null || true
          done
          echo "baseline docs: $(find timing-baseline -name '*.json' | wc -l | tr -d ' ')"

      - name: Record per-job CI timing baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p ci-timing
          node scripts/ci/check-ci-job-timing.mjs --workflow ci.yml --branch main --max-runs 15 \
            --json ci-timing/timing.json \
            --baseline-dir timing-baseline \
            --regress-threshold 30 --regress-min-seconds 60 \
            | tee -a "${GITHUB_STEP_SUMMARY}"

      # Persist this run's timing document so future firings can diff against it.
      - name: Upload timing baseline
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-timing
          path: ci-timing/timing.json
          retention-days: 30
          if-no-files-found: ignore

  ci-flaky-rate:
    name: ci-flaky-rate
    runs-on: ubuntu-latest
    # Pure advisory probe — a transient gh API error must not red the health
    # workflow (matches ci-job-timing/bench-artifact-readiness). The script also
    # retries transient transport; this is belt-and-suspenders.
    continue-on-error: true
    # Advisory: counts per-job pass<->fail conclusion flips across recent main CI
    # runs and run_attempt re-runs, surfacing a standing flaky-rate signal so the
    # determinism work (#13368/#13255) can be prioritized by impact. A flaky job
    # wedges the merge queue both ways (flaky-pass lands a regression; flaky-fail
    # ejects a good PR). No wall-clock change.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Report per-job flaky rate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node scripts/ci/check-flaky-rate.mjs --workflow CI --branch main \
            --max-runs 40 --threshold 0.15 --min-samples 4 \
            | tee -a "${GITHUB_STEP_SUMMARY}"

  dns:
    name: dns-health
    runs-on: ubuntu-latest
    steps:
      - name: Check tsz.dev DNS records (A + AAAA)
        run: |
          set -euo pipefail
          DOMAIN="tsz.dev"

          if ! command -v dig >/dev/null 2>&1; then
            echo "::error::dig is required for DNS health checks but was not found on the runner"
            exit 1
          fi

          A_RECORDS=$(dig +short A "$DOMAIN" || true)
          AAAA_RECORDS=$(dig +short AAAA "$DOMAIN" || true)

          A_COUNT=$(echo "$A_RECORDS" | grep -c '[0-9]' || true)
          AAAA_COUNT=$(echo "$AAAA_RECORDS" | grep -c ':' || true)

          {
            echo "## DNS Health — ${DOMAIN} — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "| Record | Status | Values |"
            echo "|--------|--------|--------|"
            if [[ "${A_COUNT}" -gt 0 ]]; then
              echo "| A (IPv4) | ✅ ${A_COUNT} record(s) | $(echo "$A_RECORDS" | tr '\n' ' ') |"
            else
              echo "| A (IPv4) | ❌ missing | — |"
            fi
            if [[ "${AAAA_COUNT}" -gt 0 ]]; then
              echo "| AAAA (IPv6) | ✅ ${AAAA_COUNT} record(s) | $(echo "$AAAA_RECORDS" | tr '\n' ' ') |"
            else
              echo "| AAAA (IPv6) | ⚠️ missing | — |"
              echo ""
              echo "> ⚠️ **No AAAA records found for ${DOMAIN}.**"
              echo "> Add the following GitHub Pages IPv6 addresses in Cloudflare DNS:"
              echo "> \`2606:50c0:8000::153\`, \`2606:50c0:8001::153\`, \`2606:50c0:8002::153\`, \`2606:50c0:8003::153\`"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "dns: A=${A_COUNT} AAAA=${AAAA_COUNT}"

          if [[ "${A_COUNT}" -eq 0 ]]; then
            echo "::error::CRITICAL: no A records for ${DOMAIN} — site is unreachable"
            exit 1
          fi
          if [[ "${AAAA_COUNT}" -eq 0 ]]; then
            echo "::warning::No AAAA records for ${DOMAIN} — IPv6 clients cannot reach the site (see issue #5098)"
          fi

  bench-artifact-readiness:
    name: bench-artifact-readiness
    runs-on: ubuntu-latest
    # Advisory only — a missing artifact is surfaced as a warning, not a blocker.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Find latest bench-results-merged artifact
        id: find-artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          artifact_name="${_BENCH_ARTIFACT_NAME}"

          # Walk recent successful bench.yml runs on main until we find one with
          # a non-expired bench-results-merged artifact (artifacts expire after 30 days).
          RUN_ID="$(
            gh run list \
              --repo "${repo}" \
              --workflow bench.yml \
              --branch main \
              --status success \
              --limit 20 \
              --json databaseId \
              --jq '.[].databaseId' |
            while IFS= read -r candidate; do
              artifact_id="$(
                gh api "repos/${repo}/actions/runs/${candidate}/artifacts" \
                  --jq ".artifacts[]? | select(.name == \"${artifact_name}\" and .expired == false) | .id" |
                head -n 1
              )"
              if [[ -n "${artifact_id}" ]]; then
                echo "${candidate}"
                break
              fi
            done
          )"

          if [[ -z "${RUN_ID}" ]]; then
            echo "run_id=" >> "$GITHUB_OUTPUT"
            echo "::warning::No recent successful bench.yml run has a non-expired ${artifact_name} artifact."
          else
            echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
            echo "Found bench run ${RUN_ID} with ${artifact_name} artifact."
          fi

      - name: Download bench-results-merged artifact
        if: steps.find-artifact.outputs.run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env._BENCH_ARTIFACT_NAME }}
          path: bench-artifact
          run-id: ${{ steps.find-artifact.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Run artifact readiness check
        run: |
          set -euo pipefail
          artifact="bench-artifact/bench-results.json"

          check_exit=0
          node scripts/bench/check-artifact-readiness.mjs "${artifact}" \
            --expect-source-commit="${GITHUB_SHA}" \
            --require-clean-metadata \
            --require-source-current \
            || check_exit=$?

          if [[ "${check_exit}" -eq 1 ]]; then
            echo "::warning::bench artifact is present but not current release truth; inspect the readiness report above"
          elif [[ "${check_exit}" -eq 2 ]]; then
            echo "::warning::bench artifact absent or could not be parsed — bench did not complete for latest main"
          fi
          exit 0

  bench-latest-freshness:
    name: bench-latest-freshness
    runs-on: ubuntu-latest
    # Advisory by design: a monitoring job must not red the health workflow.
    # The SIGNAL is a single deduplicated tracking issue (--file-issue), not a
    # red run — mirroring main-red-sentinel. This closes the freeze blind spot:
    # bench-artifact-readiness above inspects a freshly merged ARTIFACT and gates
    # on source-commit currency, so it stays green while the PUBLISHED
    # latest.json silently stops advancing (the 46-commit freeze went unnoticed
    # for half a day for exactly this reason).
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Detect stale published benchmark data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # bench.yml publishes only from its once-daily scheduled run
          # (bench.yml:35, moved from 03:00 to 22:00 UTC by #17561 so the run
          # finishes ahead of the 06:00 gh-pages deploy again), whose
          # full-suite job has a 360-minute timeout (bench.yml:57). So the
          # *minimum* possible gap between two publishes is already 24h, and
          # the worst case is ~24h + one run's full duration (observed up to
          # ~8h in practice, e.g. #16066's 11:14Z publish following a 03:00Z
          # start) before the next day's run even starts queueing. A 9h
          # threshold is stale by construction: it
          # fires every day for the ~15-21h between "one cadence past the last
          # publish" and "the next run finishes" regardless of whether bench
          # is healthy (see #16066 and its 15 predecessor sentinel issues,
          # all false alarms — confirmed via 8 consecutive successful daily
          # runs). 36h covers 24h cadence + double the observed worst-case
          # run duration, while still catching a genuine multi-day freeze
          # (the original "46-commit" incident this monitor was built for).
          # --file-issue opens / updates / closes one deduplicated tracking
          # issue; no --strict so a transient fetch blip never reds this
          # advisory job.
          node scripts/bench/check-latest-freshness.mjs --file-issue --max-age-hours 36 \
            | tee -a "${GITHUB_STEP_SUMMARY}"
