name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - 'crates/tsz-website/**'
      - 'crates/**/*.rs'
      - 'crates/**/Cargo.toml'
      - 'docs/**/*.md'
      - 'docs/architecture.html'
      - 'AGENTS.md'
      - 'scripts/conformance/conformance-snapshot.json'
      - 'scripts/emit/emit-snapshot.json'
      - 'scripts/fourslash/fourslash-snapshot.json'
      - '.github/workflows/gh-pages.yml'
  schedule:
    - cron: '0 6 * * *'  # Daily at 6am UTC
  workflow_run:
    workflows: ["CI", "Bench"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  # Never cancel an in-flight deploy — the check job skips if one is already
  # running so we don't queue up stale work. Manual redeploys are kept out of
  # the workflow_run pending slot so fresh benchmark publishes cannot be
  # cancelled by unrelated CI completion churn before their jobs start.
  group: ${{ github.event_name == 'workflow_dispatch' && format('pages-manual-{0}', github.ref) || format('pages-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.diff.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Skip if another deploy is already running
        id: in_flight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "workflow_dispatch redeploy requested — allowing it to queue behind any active deploy"
            echo "in_flight=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IN_FLIGHT=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/gh-pages.yml/runs?status=in_progress&per_page=20" \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }})] | length")
          QUEUED=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/gh-pages.yml/runs?status=queued&per_page=20" \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }} and .id < ${{ github.run_id }})] | length")
          BUSY=$((IN_FLIGHT + QUEUED))
          echo "Other deploy runs in_progress=${IN_FLIGHT} queued_before_us=${QUEUED}"
          if [ "$BUSY" -gt 0 ]; then
            echo "another deploy is busy — skipping this trigger"
            echo "in_flight=true" >> "$GITHUB_OUTPUT"
          else
            echo "in_flight=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for changes since last deploy
        id: diff
        env:
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_NAME: ${{ github.event.workflow_run.name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.in_flight.outputs.in_flight }}" = "true" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          artifact_ready_for_pages() {
            local artifact_id="$1"
            local tmpdir
            tmpdir="$(mktemp -d)"
            if ! gh api \
              "repos/${{ github.repository }}/actions/artifacts/${artifact_id}/zip" \
              > "${tmpdir}/artifact.zip"; then
              rm -rf "${tmpdir}"
              return 1
            fi
            if ! unzip -q "${tmpdir}/artifact.zip" -d "${tmpdir}/artifact"; then
              rm -rf "${tmpdir}"
              return 1
            fi
            if ! jq -e '
              .application_compatibility.required == true and
              .blocking_application_compatibility_gaps == 0 and
              .blocking_project_timing_pair_gaps == 0 and
              .successful_project_timing_pairs >= .required_project_timing_pairs and
              ((.corpus_health.collapsed // false) == false)
            ' "${tmpdir}/artifact/bench-results-readiness.json" >/dev/null; then
              rm -rf "${tmpdir}"
              return 1
            fi
            rm -rf "${tmpdir}"
            return 0
          }
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            if [ "$WORKFLOW_RUN_CONCLUSION" != "success" ] || \
              [ "$WORKFLOW_RUN_HEAD_BRANCH" != "main" ]; then
              echo "workflow_run was not successful main CI/Bench, skipping"
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            elif [ "$WORKFLOW_RUN_NAME" = "CI" ]; then
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            elif [ "$WORKFLOW_RUN_NAME" = "Bench" ]; then
              artifact_id="$(gh api \
                "repos/${{ github.repository }}/actions/runs/${WORKFLOW_RUN_ID}/artifacts" \
                --jq '.artifacts[]? | select(.name == "bench-results-merged" and .expired == false) | .id' 2>/dev/null |
                head -n 1)"
              if [ -n "$artifact_id" ] && artifact_ready_for_pages "$artifact_id"; then
                echo "Bench run ${WORKFLOW_RUN_ID} published a readiness-clean bench-results-merged artifact; deploying fresh benchmark data."
                echo "should_deploy=true" >> "$GITHUB_OUTPUT"
              elif [ -n "$artifact_id" ]; then
                echo "Bench run ${WORKFLOW_RUN_ID} published bench-results-merged, but readiness failed; skipping benchmark redeploy."
                echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              else
                echo "Bench run ${WORKFLOW_RUN_ID} did not publish bench-results-merged; skipping stale benchmark redeploy."
                echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "workflow_run was not successful main CI/Bench, skipping"
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git log --since="25 hours ago" --oneline | grep -q .; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes since last deploy, skipping"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  wasm:
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      # Try to reuse the web WASM artifact already built by the CI wasm job
      # for the same commit. Falls back to the local cache, then a full build.
      - name: Download web WASM from CI
        id: wasm-ci-download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CI_RUN=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?status=success&branch=main&per_page=5" \
            --jq "[.workflow_runs[] | select(.head_sha == \"${{ github.sha }}\")][0].id" 2>/dev/null || echo "")
          if [[ -n "$CI_RUN" && "$CI_RUN" != "null" ]]; then
            echo "Found CI run $CI_RUN for this SHA, downloading wasm-web artifact..."
            gh run download "$CI_RUN" -n wasm-web -D pkg/web/ 2>/dev/null \
              && echo "downloaded=true" >> "$GITHUB_OUTPUT" \
              || echo "Artifact download failed, will build locally."
          else
            echo "No matching CI run found for ${{ github.sha }}, will build locally."
          fi
        continue-on-error: true

      - name: Cache built WASM output
        id: wasm-cache
        if: steps.wasm-ci-download.outputs.downloaded != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pkg/web/
          key: wasm-web-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'crates/*/src/**', 'crates/*/build.rs') }}

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        if: steps.wasm-ci-download.outputs.downloaded != 'true' && steps.wasm-cache.outputs.cache-hit != 'true'

      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        if: steps.wasm-ci-download.outputs.downloaded != 'true' && steps.wasm-cache.outputs.cache-hit != 'true'
        with:
          cache-on-failure: true

      - name: Install wasm-pack
        if: steps.wasm-ci-download.outputs.downloaded != 'true' && steps.wasm-cache.outputs.cache-hit != 'true'
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install wasm-opt (via binaryen)
        if: steps.wasm-ci-download.outputs.downloaded != 'true' && steps.wasm-cache.outputs.cache-hit != 'true'
        run: sudo apt-get install -y binaryen

      - name: Build WASM (web target)
        if: steps.wasm-ci-download.outputs.downloaded != 'true' && steps.wasm-cache.outputs.cache-hit != 'true'
        run: |
          cp LICENSE.txt crates/tsz-wasm/LICENSE.txt
          # wasm-opt currently produces a web build that fails during
          # __wbindgen_init_externref_table in the playground runtime.
          wasm-pack build crates/tsz-wasm --target web --out-dir ../../pkg/web --no-opt

      - name: Upload WASM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-web
          path: pkg/web/
          retention-days: 7

  build:
    needs: [check, wasm]
    if: ${{ always() && needs.check.outputs.should_deploy == 'true' && !cancelled() && needs.wasm.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      # Benchmarks run in bench.yml and publish a merged GitHub Actions artifact.
      # Pull the latest successful artifact into the Pages build so the public
      # site and local previews can fetch benchmark data without external credentials.
      - name: Find latest benchmark artifact run
        id: latest-benchmark
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          artifact_ready_for_pages() {
            local artifact_id="$1"
            local tmpdir
            tmpdir="$(mktemp -d)"
            if ! gh api \
              "repos/${{ github.repository }}/actions/artifacts/${artifact_id}/zip" \
              > "${tmpdir}/artifact.zip"; then
              rm -rf "${tmpdir}"
              return 1
            fi
            if ! unzip -q "${tmpdir}/artifact.zip" -d "${tmpdir}/artifact"; then
              rm -rf "${tmpdir}"
              return 1
            fi
            if ! jq -e '
              .application_compatibility.required == true and
              .blocking_application_compatibility_gaps == 0 and
              .blocking_project_timing_pair_gaps == 0 and
              .successful_project_timing_pairs >= .required_project_timing_pairs and
              ((.corpus_health.collapsed // false) == false)
            ' "${tmpdir}/artifact/bench-results-readiness.json" >/dev/null; then
              rm -rf "${tmpdir}"
              return 1
            fi
            rm -rf "${tmpdir}"
            return 0
          }

          RUN_ID=""
          ARTIFACT_ID=""
          ARTIFACT_CREATED=""
          while IFS=$'\t' read -r candidate_run_id candidate_artifact_id candidate_created; do
            if [[ -z "${candidate_run_id}" || -z "${candidate_artifact_id}" ]]; then
              continue
            fi
            if artifact_ready_for_pages "${candidate_artifact_id}"; then
              RUN_ID="${candidate_run_id}"
              ARTIFACT_ID="${candidate_artifact_id}"
              ARTIFACT_CREATED="${candidate_created}"
              break
            fi
            echo "Skipping benchmark artifact ${candidate_artifact_id} from run ${candidate_run_id}: readiness failed."
          done < <(gh api \
            "repos/${{ github.repository }}/actions/artifacts?name=bench-results-merged&per_page=20" \
            --jq '.artifacts[]? | select(.expired == false and (.workflow_run.head_branch // "") == "main") | [.workflow_run.id, .id, .created_at] | @tsv')

          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "artifact_id=${ARTIFACT_ID}" >> "$GITHUB_OUTPUT"
          if [[ -n "$RUN_ID" ]]; then
            echo "Latest readiness-clean benchmark merged artifact: run=${RUN_ID} artifact=${ARTIFACT_ID} created=${ARTIFACT_CREATED}"
          else
            echo "No non-expired main benchmark run has a readiness-clean bench-results-merged artifact."
          fi
        continue-on-error: true

      - name: Download latest benchmark data from GitHub artifact
        if: ${{ steps.latest-benchmark.outputs.run_id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bench-results-merged
          path: artifacts
          run-id: ${{ steps.latest-benchmark.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Prepare benchmark data for website
        run: |
          snapshot="crates/tsz-website/bench-snapshot.json"
          if [[ -f artifacts/bench-results.json && -f "${snapshot}" ]]; then
            artifact_generated="$(jq -r '.generated_at // ""' artifacts/bench-results.json 2>/dev/null || echo "")"
            snapshot_generated="$(jq -r '.generated_at // ""' "${snapshot}" 2>/dev/null || echo "")"
            if [[ -n "${snapshot_generated}" && "${snapshot_generated}" > "${artifact_generated}" ]]; then
              echo "Repository benchmark snapshot (${snapshot_generated}) is newer than GitHub artifact (${artifact_generated:-unknown}); using snapshot."
              rm -f artifacts/bench-results.json artifacts/bench-results-tsgo-winners.json
            fi
          fi

          if [[ ! -f artifacts/bench-results.json ]]; then
            rm -f artifacts/bench-results-tsgo-winners.json
            echo "No benchmark artifact downloaded; bench charts will use repository/local fallback data."
            exit 0
          fi

          rows=$(jq '[.results[]?] | length' artifacts/bench-results.json 2>/dev/null || echo "0")
          timed_rows=$(jq '[.results[]? | select(.tsz_ms > 0 and .tsgo_ms > 0)] | length' artifacts/bench-results.json 2>/dev/null || echo "0")
          if [[ "${rows}" -gt 0 ]]; then
            mv artifacts/bench-results.json artifacts/bench-vs-tsgo-github-latest.json
            if [[ -f artifacts/bench-results-tsgo-winners.json ]]; then
              mv artifacts/bench-results-tsgo-winners.json artifacts/bench-vs-tsgo-github-latest.tsgo-winners.json
            fi
            echo "Prepared ${rows} benchmark rows from GitHub Actions artifact (${timed_rows} with timing pairs)."
          else
            rm -f artifacts/bench-results.json artifacts/bench-results-tsgo-winners.json
            echo "GitHub benchmark artifact has no result rows; skipping bench charts."
          fi
        continue-on-error: true

      - name: Write benchmark artifact readiness status
        run: |
          set -euo pipefail
          mkdir -p artifacts
          readiness_out="artifacts/bench-readiness-status.json"
          artifact="$(node --input-type=module <<'NODE'
          import { selectLatestBenchmarkArtifact } from "./scripts/bench/benchmark-artifact-selection.mjs";

          const selected = selectLatestBenchmarkArtifact([
            "artifacts/bench-vs-tsgo-github-latest.json",
          ]);
          process.stdout.write(selected?.file ?? "artifacts/bench-vs-tsgo-github-latest.json");
          NODE
          )"

          node scripts/bench/check-artifact-readiness.mjs "${artifact}" --json \
            --expect-source-commit="${GITHUB_SHA}" \
            > "${readiness_out}" || true
          echo "Wrote $(wc -c < "${readiness_out}") bytes to ${readiness_out}."
        continue-on-error: true

      - name: Download WASM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-web
          path: pkg/web
        continue-on-error: true

      - name: Install dependencies
        run: cd crates/tsz-website && npm install

      - name: Build website
        run: cd crates/tsz-website && npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: crates/tsz-website/dist

  deploy:
    needs: build
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
