name: runner-image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    name: runner-image-disabled
    runs-on: ubuntu-latest
    steps:
      - name: Explain GitHub Actions-only runner policy
        run: |
          echo "External runner image builds and deploys are disabled."
          echo "TSZ CI must use GitHub-hosted Actions runners unless a future PR explicitly reintroduces another non-GCP runner."
