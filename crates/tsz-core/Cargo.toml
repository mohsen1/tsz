[[test]]
name = "rewrite_semantic_completion"
path = "rewrite-tests/semantic_completion.rs"

[[test]]
name = "rewrite_emit_identifier_recovery"
path = "rewrite-tests/emit_identifier_recovery.rs"

[[test]]
