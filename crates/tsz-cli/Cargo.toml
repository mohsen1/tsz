[package]
name = "tsz-cli"
version.workspace = true
edition.workspace = true
description = "Process adapters for the clean-slate tsz compiler"
repository.workspace = true
homepage.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false
autobins = false
autotests = false

[[bin]]
name = "tsz"
path = "src/bin/tsz.rs"

[[bin]]
name = "tsz-server"
path = "src/bin/tsz_server.rs"

[[bin]]
name = "tsz-lsp"
path = "src/bin/tsz_lsp.rs"

[[bin]]
name = "try-tsz"
path = "src/bin/try_tsz.rs"

[features]
default = []
perf-tools = []

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tsz.workspace = true
walkdir.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "rewrite_process_contract"
path = "rewrite-tests/process_contract.rs"

[[test]]
name = "rewrite_standard_library_options"
path = "rewrite-tests/standard_library_options.rs"

[lints]
workspace = true
