# Nextest policy for the active clean-slate workspace. Every selected rewrite
# test is required to pass; disabled legacy oracle files are not Cargo targets.

[profile.default]
slow-timeout = { period = "30s", terminate-after = 2 }
leak-timeout = "5s"
fail-fast = false
retries = 0
test-threads = "num-cpus"

[profile.default.junit]
path = "junit.xml"

[profile.quick]
slow-timeout = { period = "10s", terminate-after = 1 }
leak-timeout = "2s"
fail-fast = true
test-threads = "num-cpus"

[profile.precommit]
slow-timeout = { period = "15s", terminate-after = 2 }
leak-timeout = "2s"
fail-fast = true
test-threads = "num-cpus"
status-level = "fail"

[profile.signoff]
slow-timeout = { period = "30s", terminate-after = 2 }
leak-timeout = "3s"
fail-fast = false
test-threads = "num-cpus"
status-level = "fail"

[profile.signoff.junit]
path = "junit.xml"

[profile.conformance]
slow-timeout = { period = "120s", terminate-after = 2 }
leak-timeout = "10s"
fail-fast = false
retries = 1
