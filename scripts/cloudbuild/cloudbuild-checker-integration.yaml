# Cloud Build config for the checker integration unit slice.
#
# Most CI jobs run directly on the Cloud Run-backed GitHub runner fleet. This
# slice is the linker-heavy exception: individual tsz-checker integration test
# binaries can exceed the 32 GiB Cloud Run runner budget, even with one Cargo
# build job.

steps:
  - id: checker-integration-test
    # Pin rustc to match the Cloud Run self-hosted runner's toolchain.
    name: rust:1.95
    env:
      - 'CARGO_BUILD_JOBS=32'
      - 'CARGO_INCREMENTAL=0'
      - 'RUST_MIN_STACK=16777216'
      - 'CARGO_TERM_COLOR=always'
      - 'TSZ_CI_SUITE=checker-integration'
      - 'TSZ_CI_SKIP_HOST_APT=1'
      - 'TSZ_CI_DISABLE_SCCACHE=1'
    script: |
      #!/usr/bin/env bash
      set -euo pipefail

      cargo --version
      rustc --version
      scripts/ci/gcp-full-ci.sh checker-integration

options:
  pool:
    name: projects/tsz-ci/locations/us-central1/workerPools/tsz-ci-build-pool-highmem
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
